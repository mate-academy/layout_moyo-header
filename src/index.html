<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Fonte Roboto 500 (romano, largura normal) -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />

    <title>Moyo Header</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <!-- Logo fora do nav -->
        <a
          href="#"
          class="header__logo-link"
        >
          <img
            src="images/logo.png"
            alt="Moyo logo"
            class="header__logo"
          />
        </a>

        <nav
          class="nav"
          aria-label="Main navigation"
        >
          <ul class="nav__list">
            <li class="nav__item nav__item--apple">
              <a
                href="#"
                class="nav__link nav__link--apple is-active"
              >
                Apple
              </a>
            </li>
            <li class="nav__item nav__item--samsung">
              <a
                href="#"
                class="nav__link nav__link--samsung"
              >
                Samsung
              </a>
            </li>
            <li class="nav__item nav__item--smartphones">
              <a
                href="#"
                class="nav__link nav__link--smartphones"
              >
                Smartphones
              </a>
            </li>
            <li class="nav__item nav__item--laptops">
              <a
                href="#"
                class="nav__link nav__link--laptops"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li class="nav__item nav__item--gadgets">
              <a
                href="#"
                class="nav__link nav__link--gadgets"
              >
                Gadgets
              </a>
            </li>
            <li class="nav__item nav__item--tablets">
              <a
                href="#"
                class="nav__link nav__link--tablets"
              >
                Tablets
              </a>
            </li>
            <li class="nav__item nav__item--photo">
              <a
                href="#"
                class="nav__link nav__link--photo"
              >
                Photo
              </a>
            </li>
            <li class="nav__item nav__item--video">
              <a
                href="#"
                class="nav__link nav__link--video"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
