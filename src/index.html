<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <div class="header__container">
        <a
          href="#"
          class="header__logo-link"
        >
          <img
            src="./images/logo.png"
            alt="Moyo company logo"
          />
        </a>
        <nav class="nav__list">
          <ul class="header__nav-list">
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-link is-active"
              >
                Apple
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-link"
              >
                Samsung
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-link"
              >
                Smartphones
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-link"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-link"
              >
                Gadgets
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-link"
              >
                Tablets
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-link"
              >
                Photo
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-link"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
