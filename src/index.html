<!doctype html>
<html lang="en">

    <title>Moyo header</title>
    <link

          <li class="list-item">

              class="nav-link"
              href="#"

          <li class="list-item">
            <a
              class="nav-link"
              href="#"

              smartphones

            <a

            <a

          <li class="list-item">

              class="nav-link"

              tablets
            </a>
          </li>
          <li class="list-item">

              class="nav-link"
              href="#"

          <li class="list-item">
            <a
              class="nav-link"
