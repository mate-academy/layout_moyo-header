<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="/home"
        class="header_link"
      >
        <img
          class="header_logo"
          src="./images/logo.png"
          alt="moyo_logo"
        />
      </a>

      <nav class="header_nav">
        <ul class="header_nav-list">
          <a
            href="/apple"
            class="header_nav-link is-active"
          >
            <li class="header_nav_item">apple</li>
          </a>
          <a
            href="/samsung"
            class="header_nav-link"
          >
            <li class="header_nav_item">samsung</li>
          </a>
          <a
            href="/samsung"
            class="header_nav-link"
          >
            <li class="header_nav_item">smartphones</li>
          </a>
          <a
            href="/laptops&computers"
            class="header_nav-link"
            data-qa="hover"
          >
            <li class="header_nav_item">laptops & computers</li>
          </a>
          <a
            href="/gadgets"
            class="header_nav-link"
          >
            <li class="header_nav_item">gadgets</li>
          </a>
          <a
            href="tablets"
            class="header_nav-link"
          >
            <li class="header_nav_item">tablets</li>
          </a>
          <a
            href="photo"
            class="header_nav-link"
          >
            <li class="header_nav_item">photo</li>
          </a>
          <a
            href="/video"
            class="header_nav-link"
          >
            <li class="header_nav_item">video</li>
          </a>
        </ul>
      </nav>
    </header>
  </body>
</html>
