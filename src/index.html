<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="roboto-style header">
      <a href="img">
        <img
          class="img"
          src="images/logo.png"
          alt="image"
        />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li>
            <a
              class="nav__link is-active"
              href="apple"
            >
              apple
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="samsung"
            >
              samsung
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="smartphones"
            >
              smartphones
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="gadgets"
            >
              gadgets
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="tables"
            >
              tables
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="photo"
            >
              photo
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="video"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
