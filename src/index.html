<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />

  <body>
    <header>
      <a
        id="logo"
        href="#"
      >
        <img
          src="images/logo.png"
          alt="logo"
        />
      </a>
      <nav>
        <ul>
          <li class="options is-active">
            <a
              href="#"
              class="opt_link is-active"
            >
              apple
            </a>
          </li>
          <li class="options">
            <a
              href="#"
              class="opt_link"
            >
              samsung
            </a>
          </li>
          <li class="options">
            <a
              href="#"
              class="opt_link"
            >
              smartphones
            </a>
          </li>
          <li class="options">
            <a
              href="#"
              data-qa="hover"
              class="opt_link"
            >
              laptops & computers
            </a>
          </li>
          <li class="options">
            <a
              href="#"
              class="opt_link"
            >
              gadgets
            </a>
          </li>
          <li class="options">
            <a
              href="#"
              class="opt_link"
            >
              tablets
            </a>
          </li>
          <li class="options">
            <a
              href="#"
              class="opt_link"
            >
              photo
            </a>
          </li>
          <li class="options">
            <a
              href="#"
              class="opt_link"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
