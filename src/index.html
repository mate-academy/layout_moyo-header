<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <!-- Preconnect to Google Fonts for performance -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <!-- Load Roboto font with weight 500 only -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <!-- Link to your CSS file -->
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <h1>Moyo header</h1>
    <header class="header">
      <div class="logo">
        <a
          href="#"
          class="logo__link"
        >
          <img
            src="images/logo.png"
            alt="Moyo company logo"
            class="logo__image"
          />
        </a>
      </div>
      <nav>
        <ul class="nav_list">
          <li class="nav_list__item">
            <a
              href="#"
              class="nav_list__link is-active"
            >
              Apple
            </a>
          </li>

          <li class="nav_list__item">
            <a
              href="#"
              class="nav_list__link"
            >
              Samsung
            </a>
          </li>

          <li class="nav_list__item">
            <a
              href="#"
              class="nav_list__link"
            >
              Smartphones
            </a>
          </li>

          <li class="nav_list__item">
            <a
              href="#"
              class="nav_list__link"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>

          <li class="nav_list__item">
            <a
              href="#"
              class="nav_list__link"
            >
              Gadgets
            </a>
          </li>

          <li class="nav_list__item">
            <a
              href="#"
              class="nav_list__link"
            >
              Tablets
            </a>
          </li>

          <li class="nav_list__item">
            <a
              href="#"
              class="nav_list__link"
            >
              Photo
            </a>
          </li>

          <li class="nav_list__item">
            <a
              href="#"
              class="nav_list__link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
