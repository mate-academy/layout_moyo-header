<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header class="header">
      <img
        class="logo"
        src="images/logo.png"
        alt="Moyo logo"
      />
      <nav class="nav">
        <ul class="nav_list">
          <li class="nav_item">
            <a
              class="is-active button-link"
              href="#Apple"
            >
              APPLE
            </a>
          </li>
          <li class="nav_item">
            <a
              class="button-link"
              href="#Samsung"
            >
              SAMSUNG
            </a>
          </li>
          <li class="nav_item">
            <a
              class="button-link"
              href="#Smartphones"
            >
              SMARTPHONES
            </a>
          </li>
          <li class="nav_item">
            <a
              class="button-link"
              href="#Laptops&Computers"
              data-qa="hover"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>
          <li class="nav_item">
            <a
              class="button-link"
              href="#Gadgets"
            >
              GADGETS
            </a>
          </li>
          <li class="nav_item">
            <a
              class="button-link"
              href="#Tablets"
            >
              TABLETS
            </a>
          </li>
          <li class="nav_item">
            <a
              class="button-link"
              href="#Photo"
            >
              PHOTO
            </a>
          </li>
          <li class="nav_item">
            <a
              class="button-link"
              href="#Video"
            >
              VIDEO
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
