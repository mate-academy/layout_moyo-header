<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo header</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body class="page">
    <header class="header">
      <a
        href="#"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="Moyo logo"
          class="logo__image"
        />
      </a>

      <nav class="navigation">
        <ul class="navList">
          <li class="navList__item">
            <a
              href="#"
              class="navLink is-active"
              data-qa="hover"
            >
              Apple
            </a>
          </li>

          <li class="navList__item">
            <a
              href="#"
              class="navLink"
            >
              Samsung
            </a>
          </li>

          <li class="navList__item">
            <a
              href="#"
              class="navLink"
            >
              Smartphones
            </a>
          </li>

          <li class="navList__item">
            <a
              href="#"
              class="navLink"
            >
              Gadgets
            </a>
          </li>

          <li class="navList__item">
            <a
              href="#"
              class="navLink"
            >
              Tablets
            </a>
          </li>

          <li class="navList__item">
            <a
              href="#"
              class="navLink"
            >
              Photo
            </a>
          </li>

          <li class="navList__item">
            <a
              href="#"
              class="navLink"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
