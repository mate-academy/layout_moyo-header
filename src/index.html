<!doctype html>
<html lang="en">

            <a
              href="#"

            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav-item">
            <a href="#">Gadgets</a>
          </li>
          <li class="nav-item">
            <a href="#">Tablets</a>
          </li>
          <li class="nav-item">
            <a href="#">Photo</a>
