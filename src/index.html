<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a href="#logo">
        <img
          src="images/logo.png"
          alt="Company logo"
          class="logo"
        />
      </a>
      <nav>
        <ul class="nav">
          <li class="nav__link">
            <a
              class="nav__link__item is-active"
              href="#apple-section"
            >
              Apple
            </a>
          </li>

          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#samsung-section"
            >
              Samsung
            </a>
          </li>

          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#smartphones-section"
            >
              Smartphones
            </a>
          </li>

          <li class="nav__link">
            <a
              class="nav__link__item special_nav__link__item"
              href="#laptops&computers-section"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>

          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#dargets-section"
            >
              Gadgets
            </a>
          </li>

          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#tables-section"
            >
              Tablets
            </a>
          </li>

          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#photo-section"
            >
              Photo
            </a>
          </li>

          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#video-section"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
