<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="./index.html"
        class="logo_link"
      >
        <img
          src="./images/logo.png"
          alt="Moyo logo"
          class="logo_img"
        />
      </a>

      <nav class="nav">
        <ul class="nav_list">
          <li class="nav_item">
            <a
              href="https://www.moyo.ua/ua/telecommunication/smart/apple/"
              class="nav_link is-active"
            >
              apple
            </a>
          </li>
          <li class="nav_item">
            <a
              href="https://www.moyo.ua/ua/telecommunication/smart/samsung/"
              class="nav_link"
            >
              samsung
            </a>
          </li>
          <li class="nav_item">
            <a
              href="https://www.moyo.ua/portal_brand/smartphones_phones/"
              class="nav_link"
            >
              smartphones
            </a>
          </li>
          <li class="nav_item">
            <a
              href="https://www.moyo.ua/portal_brand/comp_and_periphery/"
              class="nav_link"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>
          <li class="nav_item">
            <a
              href="https://www.moyo.ua/ua/portal_brand/photo_video/"
              class="nav_link"
            >
              gadgets
            </a>
          </li>

          <li class="nav_item">
            <a
              href="https://www.moyo.ua/tablet_el_knigi/tablet/"
              class="nav_link"
            >
              tablets
            </a>
          </li>

          <li class="nav_item">
            <a
              href="https://www.moyo.ua/foto_video/photo_video/cameras/"
              class="nav_link"
            >
              photo
            </a>
          </li>

          <li class="nav_item">
            <a
              href="https://www.moyo.ua/foto_video/video_tech/camcoder/"
              class="nav_link"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
