<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__container">
        <a
          href="/"
          class="logo"
        >
          <img
            src="images/logo.png"
            alt="Moyo company logo"
            class="logo__image"
          />
        </a>
        <nav class="nav">
          <ul class="nav-list">
            <li class="nav-item">
              <a
                href="#"
                class="nav-link is-active"
              >
                Apple
              </a>
            </li>
            <li class="nav-item">
              <a
                href="#"
                class="nav-link"
              >
                Samsung
              </a>
            </li>
            <li class="nav-item">
              <a
                href="#"
                class="nav-link"
              >
                Smartphones
              </a>
            </li>
            <li class="nav-item">
              <a
                href="#"
                class="nav-link"
                data-qa="hover"
              >
                Laptops & computers
              </a>
            </li>
            <li class="nav-item">
              <a
                href="#"
                class="nav-link"
              >
                Gadgets
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
