<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Edu+AU+VIC+WA+NT+Hand:wght@500&family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <a
          href="logo"
          id="logo"
        >
          <img
            src="/src/images/logo.png"
            alt="logo"
          />
        </a>
      </div>
      <div class="navigation">
        <nav>
          <ul class="roboto-life">
            <li class="first">
              <a
                href="apple"
                class="is-active"
              >
                apple
              </a>
            </li>
            <li>
              <a href="samsung">samsung</a>
            </li>
            <li>
              <a href="smartphones">Smartphones</a>
            </li>
            <li>
              <a
                href="laptops&computers"
                class="test"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li>
              <a href="gadgets">Gadgets</a>
            </li>
            <li>
              <a href="tablets">Tablets</a>
            </li>
            <li>
              <a href="photo">Photo</a>
            </li>
            <li class="last">
              <a href="video">Video</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
