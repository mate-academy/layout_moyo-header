<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Moyo header</title>

    <!-- ✅ Google Fonts CORRETO -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <body>
    <header class="header">
      <div class="container">
        <!-- LOGO -->
        <a
          href="#"
          class="logo"
        >
          <img
            src="./images/logo.png"
            alt="Moyo logo"
            class="logo__img"
          />
        </a>

        <!-- NAV -->
        <nav>
          <ul class="nav">
            <li class="nav__item">
              <a
                href="#"
                class="nav__link is-active"
              >
                Apple
              </a>
            </li>

            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
              >
                Samsung
              </a>
            </li>

            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
              >
                Smartphones
              </a>
            </li>

            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
                data-qa="hover"
              >
                Laptops & computers
              </a>
            </li>

            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
              >
                Gadgets
              </a>
            </li>

            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
              >
                Tablets
              </a>
            </li>

            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
              >
                Photo
              </a>
            </li>

            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
