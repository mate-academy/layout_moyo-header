<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="#"
        class="logo-link"
      >
        <img
          src="https://github.com/HolyVodi4ka/layout_moyo-header/blob/master/src/images/logo.png?raw=true"
          alt="Logo"
          class="logo-img"
        />
      </a>
      <nav class="nav">
        <ul class="nav-list">
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Apple
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Samsung
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Smartphones
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link is-active"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Gadgets
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Tablets
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Photo
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
