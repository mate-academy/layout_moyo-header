<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="main-header">
      <div class="container-header">
        <div class="logo-container">
          <a href="#">
            <img
              src="./images/logo.png"
              alt="Logo"
            />
          </a>
        </div>
        <nav class="main-nav">
          <ul>
            <li>
              <a
                href="#"
                class="main-link is-active"
              >
                <span>Apple</span>
              </a>
            </li>
            <li>
              <a
                href="#"
                class="main-link"
              >
                <span>Samsung</span>
              </a>
            </li>
            <li>
              <a
                href="#"
                class="main-link"
              >
                <span>Smartphones</span>
              </a>
            </li>
            <li>
              <a
                href="#"
                class="main-link"
                data-qa="hover"
              >
                <span>Laptops & Computers</span>
              </a>
            </li>
            <li>
              <a
                href="#"
                class="main-link"
              >
                <span>Gadgets</span>
              </a>
            </li>
            <li>
              <a
                href="#"
                class="main-link"
              >
                <span>Tablets</span>
              </a>
            </li>
            <li>
              <a
                href="#"
                class="main-link"
              >
                <span>Photo</span>
              </a>
            </li>
            <li>
              <a
                href="#"
                class="main-link"
              >
                <span>Video</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
