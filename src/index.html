<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo Header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a
          href="/"
          class="logo"
        >
          <img
            src="images/logo.png"
            alt="Moyo company logo"
          />
        </a>
        <nav class="nav">
          <ul class="nav__list">
            <li>
              <a
                href="#"
                class="nav__link apple is-active"
              >
                Apple
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav__link samsung"
              >
                Samsung
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav__link smartphones"
              >
                Smartphones
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav__link laptops-computers"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav__link gadgets"
              >
                Gadgets
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav__link tablets"
              >
                Tablets
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav__link photo"
              >
                Photo
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav__link video"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
