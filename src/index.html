<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moyo header</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">

    <header class="header">

      </a>
      <nav class="nav">
        <ul class="nav_list">
          <li class="nav_item">
            <a href="#" class="nav_link">Apple</a>
          </li>
          <li class="nav_item">
            <a href="#" class="nav_link">Samsung</a>
          </li>
          <li class="nav_item">
            <a href="#" class="nav_link">Smartphones</a>
          </li>
          <li class="nav_item">
            <a
              href="#"
              class="nav_link is-active"
              aria-current="page"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>
          <li class="nav_item">
            <a href="#" class="nav_link">Gadgets</a>
          </li>
          <li class="nav_item">
            <a href="#" class="nav_link">Tablets</a>
          </li>
          <li class="nav_item">
            <a href="#" class="nav_link">Photos</a>
          </li>
          <li class="nav_item">

</html>
