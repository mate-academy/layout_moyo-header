<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header__main">
      <a
        href="#"
        class="nav-menu__logo"
      >
        <img
          class="logo"
          src="./images/logo.png"
          alt="Moyo logo"
        />
      </a>

      <nav>
        <ul class="nav-menu">
          <li class="nav-menu__item">
            <a
              href="#"
              class="nav-menu__link is-active"
            >
              Apple
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#"
              class="nav-menu__link"
            >
              Samsung
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#"
              class="nav-menu__link"
            >
              Smartphones
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#"
              class="nav-menu__link"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#"
              class="nav-menu__link"
            >
              Gadgets
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#"
              class="nav-menu__link"
            >
              Tablets
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#"
              class="nav-menu__link"
            >
              Photo
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#"
              class="nav-menu__link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
