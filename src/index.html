<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./reset.css"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <a href="/">
        <img
          class="logo"
          src="./images/logo.png"
          alt="logo"
        />
      </a>

      <nav class="nav">
        <ul class="ul">
          <li>
            <a
              href="#apple"
              class="is-active link"
            >
              APPLE
            </a>
          </li>
          <li>
            <a
              href="#samsung"
              class="link"
            >
              SAMSUNG
            </a>
          </li>
          <li>
            <a
              href="#smartphone"
              class="link"
            >
              SMARTPHONES
            </a>
          </li>
          <li>
            <a
              href="#laptops&computers"
              class="link"
              data-qa="hover"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>
          <li>
            <a
              href="#gadgets"
              class="link"
            >
              GADGETS
            </a>
          </li>
          <li>
            <a
              href="#tablets"
              class="link"
            >
              TABLETS
            </a>
          </li>
          <li>
            <a
              href="#photos"
              class="link"
            >
              PHOTO
            </a>
          </li>
          <li>
            <a
              href="#videos"
              class="link"
            >
              VIDEO
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
