<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Moyo Header</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    >
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header>
      <a
        href="/"
        class="logo"
      >
        <img src="src/images/logo.png" alt="Logo">
      </a>
      <nav>
        <ul>
          <li>
            <a
              href="#"
              class="element apple is-active"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              href="#"
              class="element samsung"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              href="#"
              class="element smartphones"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              href="#"
              class="element laptops-computers"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li>
            <a
              href="#"
              class="element gadgets"
            >
              Gadgets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="element tablets"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="element photo"
            >
              Photo
            </a>
          </li>
          <li>
            <a
              href="#"
              class="element video"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
