<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo Header</title>

    <!-- Google Fonts: Roboto (500, normal width) -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body>
    <header class="page-header">
      <div class="container">
        <!-- Logo: lewy element we flex (50px od lewej krawędzi kontenera) -->
        <a
          href="#home"
          class="logo"
        >
          <img
            src="./images/logo.png"
            alt="Moyo Logo"
          />
        </a>

        <!-- Nawigacja: prawy element we flex (50px od prawej krawędzi kontenera) -->
        <nav>
          <ul class="nav-list">
            <li>
              <a
                href="#apple"
                class="nav-link nav-link--apple"
              >
                Apple
              </a>
            </li>
            <li>
              <a
                href="#samsung"
                class="nav-link"
              >
                Samsung
              </a>
            </li>
            <li>
              <a
                href="#smartphones"
                class="nav-link"
              >
                Smartphones
              </a>
            </li>
            <li>
              <a
                href="#laptops"
                class="nav-link is-active nav-link--laptops"
                data-qa="hover"
              >
                Laptops &amp; Computers
              </a>
            </li>
            <li>
              <a
                href="#gadgets"
                class="nav-link"
              >
                Gadgets
              </a>
            </li>
            <li>
              <a
                href="#tablets"
                class="nav-link"
              >
                Tablets
              </a>
            </li>
            <li>
              <a
                href="#photo"
                class="nav-link"
              >
                Photo
              </a>
            </li>
            <li>
              <a
                href="#video"
                class="nav-link"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>

</html>
