<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="true"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__logo">
        <a
          href="#"
          class="header-logo"
        >
          <img
            class="header__logo-img"
            src="./images/logo.png"
            alt="Moyo Logo"
          />
        </a>
      </div>
      <nav class="header__nav">
        <ul class="nav-list">
          <li class="nav-list__item">
            <a
              class="nav-list__link is-active"
              href="#apple"
            >
              Apple
            </a>
          </li>

          <li class="nav-list__item">
            <a
              class="nav-list__link"
              href="#samsung"
            >
              Samsung
            </a>
          </li>

          <li class="nav-list__item">
            <a
              class="nav-list__link"
              href="#smartphones"
            >
              Smartphones
            </a>
          </li>

          <li class="nav-list__item">
            <a
              class="nav-list__link"
              href="#laptops&computers"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>

          <li class="nav-list__item">
            <a
              class="nav-list__link"
              href="#gadgets"
            >
              Gadgets
            </a>
          </li>

          <li class="nav-list__item">
            <a
              class="nav-list__link"
              href="#tablets"
            >
              Tablets
            </a>
          </li>

          <li class="nav-list__item">
            <a
              class="nav-list__link"
              href="#photo"
            >
              Photo
            </a>
          </li>

          <li class="nav-list__item">
            <a
              class="nav-list__link"
              href="#video"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
