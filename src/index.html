<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <!-- <div class="container"> -->
      <a
        class="link-logo"
        href="https://www.apple.com/ua/"
        target="_blank"
      >
        <img
          src="./images/logo.png"
          alt="MOYO Logo"
          class="logo"
        />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item item-1">
            <a
              class="nav__link is-active"
              href="https://comfy.ua/ua/portable-sound/"
            >
              apple
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="https://comfy.ua/ua/trimmer-for-tissue/"
            >
              samsung
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="https://www.samsung.com/ru/watches/classic/"
            >
              smartphones
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              data-qa="hover"
              href="https://comfy.ua/ua/household-chemicals/for-washing/"
            >
              laptops & computers
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="https://comfy.ua/ua/refrigerator/"
            >
              gadgets
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="https://comfy.ua/"
            >
              tablets
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="https://comfy.ua/ua/coffi-mash/"
            >
              photo
            </a>
          </li>

          <li class="nav__item item-8">
            <a
              class="nav__link"
              href="https://comfy.ua/ua/kids/toys-for-children/"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
      <!-- </div> -->
    </header>
  </body>
</html>
