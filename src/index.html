<!DOCTYPE html>
<html lang="uk">

  />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

          <li class="nav-item"><a class="nav-link" data-qa="hover" href="#">Lenovo</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Xiaomi</a></li>
