<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a
          href="#"
          class="logo"
        >
          <img
            src="./images/logo.png"
            alt="Moyo logo"
          />
        </a>
        <nav class="menu">
          <a
            href="#"
            class="menu__item is-active"
          >
            apple
          </a>

          <a
            href="#"
            class="menu__item"
          >
            samsung
          </a>

          <a
            href="#"
            class="menu__item"
          >
            smartphones
          </a>

          <a
            href="#"
            data-qa="hover"
            class="menu__item"
          >
            laptops & computers
          </a>

          <a
            href="#"
            class="menu__item"
          >
            gadgets
          </a>

          <a
            href="#"
            class="menu__item"
          >
            pablets
          </a>

          <a
            href="#"
            class="menu__item"
          >
            photo
          </a>

          <a
            href="#"
            class="menu__item"
          >
            video
          </a>
        </nav>
      </div>
    </header>
  </body>
</html>
