<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="#"
        class="logo-link"
      >
        <img
          src="images/logo.png"
          class="logo-image"
          alt="Moyo company logo"
          width="40"
          height="40"
        />
      </a>

      <nav class="main-nav">
        <ul class="main-nav__list">
          <li class="main-nav__item">
            <a
              href="apple"
              class="main-nav__link is-active"
            >
              Apple
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="samsung"
              class="main-nav__link"
            >
              Samsung
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="smartphones"
              class="main-nav__link"
            >
              Smartphones
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="laptops-computers"
              data-qa="hover"
              class="main-nav__link"
            >
              Laptops &amp; Computers
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="gadgets"
              class="main-nav__link"
            >
              Gadgets
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="tablets"
              class="main-nav__link"
            >
              Tablets
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="photo"
              class="main-nav__link"
            >
              Photo
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="video"
              class="main-nav__link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
