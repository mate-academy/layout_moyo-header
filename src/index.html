<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <h1>Moyo header</h1>
    <header class="header">
      <a
        href="#logo"
        class="header__logo"
      >
        <img
          src="images/logo.png"
          alt="Moyo logo"
        />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              class="nav__link is-active"
              href="#apple-selection"
            >
              APPLE
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#samsung-selection"
            >
              SAMSUNG
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#samsung-selection"
            >
              SMARTPHONES
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#laptops-computers-selection"
              data-qa="hover"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#gadgets-selection"
            >
              GADGETS
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#tablets-selection"
            >
              TABLETS
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#photo-selection"
            >
              PHOTO
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__item"
              href="#video-selection"
            >
              VIDEO
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
