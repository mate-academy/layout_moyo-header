<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <img
        class="logo"
        src="images/logo.png"
        alt="Logo Moyo"
      />
      <nav class="nav">
        <a
          class="nav__link is-active"
          href="#apple"
        >
          APPLE
        </a>
        <a
          class="nav__link"
          href="#samsung"
        >
          SAMSUNG
        </a>
        <a
          class="nav__link"
          href="#smartphones"
        >
          SMARTPHONES
        </a>
        <a
          class="nav__link"
          href="#laptops&computers"
          data-qa="hover"
        >
          LAPTOPS&nbsp;&&nbsp;COMPUTERS
        </a>
        <a
          class="nav__link"
          href="#gadgets"
        >
          GADGETS
        </a>
        <a
          class="nav__link"
          href="#tablets"
        >
          TABLETS
        </a>
        <a
          class="nav__link"
          href="#photo"
        >
          PHOTO
        </a>
        <a
          class="nav__link"
          href="#video"
        >
          VIDEO
        </a>
      </nav>
    </header>
  </body>
</html>
