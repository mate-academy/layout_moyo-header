<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <body>
    <header class="header">
      <a
        class="header-logo"
        href="/#"
      >
        <img
          src="./images/logo.png"
          alt="moyo_logo"
        />
      </a>
      <nav class="navigation">
        <ul class="navigation-lists">
          <li class="navigation-lists-item">
            <a
              class="navigation-lists-item-link is-active"
              href="/#"
            >
              APPLE
            </a>
          </li>
          <li class="navigation-lists-item">
            <a
              class="navigation-lists-item-link"
              href="/#"
            >
              SAMSUNG
            </a>
          </li>
          <li class="navigation-lists-item">
            <a
              class="navigation-lists-item-link"
              href="/#"
            >
              SMARTPHONES
            </a>
          </li>
          <li
            class="navigation-lists-item"
            data-qa="hover"
          >
            <a
              class="navigation-lists-item-link"
              href="/#"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>
          <li class="navigation-lists-item">
            <a
              class="navigation-lists-item-link"
              href="/#"
            >
              GADGETS
            </a>
          </li>
          <li class="navigation-lists-item">
            <a
              class="navigation-lists-item-link"
              href="/#"
            >
              TABLETS
            </a>
          </li>
          <li class="navigation-lists-item">
            <a
              class="navigation-lists-item-link"
              href="/#"
            >
              PHOTO
            </a>
          </li>
          <li class="navigation-lists-item">
            <a
              class="navigation-lists-item-link"
              href="/#"
            >
              VIDEO
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
