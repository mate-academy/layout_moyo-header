<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <a
        href="#"
        class="logo-link"
      >
        <img
          class="logo"
          src="images/logo.png"
          alt="moyo logo"
        />
      </a>

      <nav class="nav">
        <ul class="nav-list">
          <li class="nav-list-item">
            <a
              href="#apple"
              class="nav-links is-active"
            >
              Apple
            </a>
          </li>
          <li class="nav-list-item">
            <a
              href="#samsung"
              class="nav-links"
            >
              Samsung
            </a>
          </li>
          <li class="nav-list-item">
            <a
              href="#smartpones"
              class="nav-links"
            >
              Smartphones
            </a>
          </li>
          <li class="nav-list-item">
            <a
              href="#laptops"
              data-qa="hover"
              class="nav-links"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav-list-item">
            <a
              href="#gadget"
              class="nav-links"
            >
              Gadgets
            </a>
          </li>
          <li class="nav-list-item">
            <a
              href="#tablet"
              class="nav-links"
            >
              Tablets
            </a>
          </li>
          <li class="nav-list-item">
            <a
              href="#photo"
              class="nav-links"
            >
              Photo
            </a>
          </li>
          <li class="nav-list-item">
            <a
              href="#video"
              class="nav-links"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
