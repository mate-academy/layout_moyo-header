<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="index.html"
        class="logo-link"
      >
        <img
          class="logo"
          src="images/logo.png"
          alt="Company Logo"
        />
      </a>
      <nav class="main-nav">
        <ul class="nav-list">
          <li>
            <a
              href="#1"
              class="nav-link is-active"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              href="#2"
              class="nav-link"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              href="#3"
              class="nav-link"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              href="#4"
              data-qa="hover"
              class="nav-link"
            >
              Laptops & Computers
            </a>
          </li>
          <li>
            <a
              href="#5"
              class="nav-link"
            >
              Gadgets
            </a>
          </li>
          <li>
            <a
              href="#6"
              class="nav-link"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              href="#7"
              class="nav-link"
            >
              Photo
            </a>
          </li>
          <li>
            <a
              href="#8"
              class="nav-link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
      <div class="right-padding"></div>
    </header>
  </body>
</html>
