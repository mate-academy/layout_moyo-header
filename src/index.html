<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header class="moyo-header">
      <div class="moyo-header__brand">
        <a href="#">
          <img
            src="./images/logo.png"
            alt="Moyo Logo"
            class="moyo-header__logo"
          />
        </a>
      </div>

      <nav class="moyo-header__nav">
        <ul>
          <li>
            <a
              href="#"
              class="moyo-header__link is-active"
            >
              APPLE
            </a>
          </li>
          <li>
            <a
              href="#"
              class="moyo-header__link"
            >
              SAMSUNG
            </a>
          </li>
          <li>
            <a
              href="#"
              class="moyo-header__link"
            >
              SMARTPHONES
            </a>
          </li>
          <li>
            <a
              href="#"
              class="moyo-header__link"
              data-qa="hover"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>
          <li>
            <a
              href="#"
              class="moyo-header__link"
            >
              GADGETS
            </a>
          </li>
          <li>
            <a
              href="#"
              class="moyo-header__link"
            >
              TABLETS
            </a>
          </li>
          <li>
            <a
              href="#"
              class="moyo-header__link"
            >
              PHOTO
            </a>
          </li>
          <li>
            <a
              href="#"
              class="moyo-header__link"
            >
              VIDEO
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
