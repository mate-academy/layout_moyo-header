<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="main-header">
      <a
        href="#"
        class="header-logo"
      >
        <img
          src="images/logo.png"
          alt="MOYO"
        />
      </a>
      <nav class="header-nav">
        <ul class="menu-list">
          <li>
            <a
              href="#"
              class="menu-link menu-1 is-active"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              href="#"
              class="menu-link menu-2"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              href="#"
              class="menu-link menu-3"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              href="#"
              class="menu-link menu-4"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li>
            <a
              href="#"
              class="menu-link menu-5"
            >
              Gadgets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="menu-link menu-6"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="menu-link menu-7"
            >
              Photo
            </a>
          </li>
          <li>
            <a
              href="#"
              class="menu-link menu-8"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
