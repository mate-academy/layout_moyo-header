<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo Header</title>

    <!-- Google Fonts: Roboto (500) -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- Główny plik ze stylami -->
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body>
    <header class="page-header">
      <div class="container">
        <!-- Logo: lewa strona -->
        <a
          href="#home"
          class="logo"
        >
          <img
            src="./images/logo.png"
            alt="Moyo Logo"
          />
        </a>

        <!-- Nawigacja: prawa strona -->
        <nav>
          <ul class="nav-list">
            <!-- Apple jest aktywne -> niebieski + 4px prostokąt -->
            <li>
              <a
                href="#apple"
                class="nav-link is-active"
              >
                apple
              </a>
            </li>
            <li>
              <a
                href="#samsung"
                class="nav-link"
              >
                samsung
              </a>
            </li>
            <li>
              <a
                href="#smartphones"
                class="nav-link"
              >
                smartphones
              </a>
            </li>
            <!-- Laptops & Computers -> tylko niebieski (bez prostokąta) -->
            <li>
              <a
                href="#laptops"
                data-qa="hover"
                class="nav-link is-blue"
              >
                laptops &amp; computers
              </a>
            </li>
            <li>
              <a
                href="#gadgets"
                class="nav-link"
              >
                gadgets
              </a>
            </li>
            <li>
              <a
                href="#tablets"
                class="nav-link"
              >
                tablets
              </a>
            </li>
            <li>
              <a
                href="#photo"
                class="nav-link"
              >
                photo
              </a>
            </li>
            <li>
              <a
                href="#video"
                class="nav-link"
              >
                video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
