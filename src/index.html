<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a
          href="#"
          class="logo__link"
        >
          <img
            class="logo"
            src="images/logo.png"
            alt="logo Moyo"
          />
        </a>

        <nav class="header__nav">
          <ul>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-item--link is-active"
              >
                apple
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-item--link"
              >
                samsung
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-item--link"
              >
                smartphones
              </a>
            </li>
            <li
              class="header__nav-item"
              data-qa="hover"
            >
              <a
                href="#"
                class="header__nav-item--link"
              >
                laptops & computers
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-item--link"
              >
                gadgets
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-item--link"
              >
                tablets
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-item--link"
              >
                photo
              </a>
            </li>
            <li class="header__nav-item">
              <a
                href="#"
                class="header__nav-item--link"
              >
                video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
