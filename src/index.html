<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="header-nav">
        <a class="nav-icon">
          <img
            src="./images/logo.png"
            alt="Moyo logo"
          />
        </a>
        <nav class="nav">
          <ul class="link-in-nav">
            <li>
              <a
                class="nav-link nav__item-1 is-active"
                href="#Apple"
              >
                Apple
              </a>
            </li>
            <li>
              <a
                class="nav-link"
                href="#Samsung"
              >
                Samsung
              </a>
            </li>
            <li>
              <a
                class="nav-link"
                href="#Smartphones"
              >
                Smartphones
              </a>
            </li>
            <li>
              <a
                data-qa="hover"
                class="nav-link"
                href="#Lap&Comp"
              >
                Laptops & Computers
              </a>
            </li>
            <li>
              <a
                class="nav-link"
                href="#Gadgets"
              >
                Gadgets
              </a>
            </li>
            <li>
              <a
                class="nav-link"
                href="#Tablets"
              >
                Tablets
              </a>
            </li>
            <li>
              <a
                class="nav-link"
                href="#Photo"
              >
                Photo
              </a>
            </li>
            <li>
              <a
                class="nav-link nav__item-2"
                href="#Video"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
