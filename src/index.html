<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a href="#">
        <img
          src="./images/logo.png"
          class="logo"
          alt="logo"
        />
      </a>

      <nav class="nav">
        <ul class="list">
          <li class="nav_1 apple">
            <a
              class="is-active link"
              href="#"
            >
              Apple
            </a>
          </li>

          <li class="nav_1 samsung">
            <a
              class="link"
              href="#"
            >
              Samsung
            </a>
          </li>

          <li class="nav_1 smartphones">
            <a
              class="link"
              href="#"
            >
              smartphones
            </a>
          </li>

          <li class="nav_1 laptops-computers">
            <a
              class="link"
              href="#"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>

          <li class="nav_1 gadgets">
            <a
              class="link"
              href="#"
            >
              Gadgets
            </a>
          </li>

          <li class="nav_1 tablet">
            <a
              class="link"
              href="#"
            >
              Tablets
            </a>
          </li>

          <li class="nav_1 photo">
            <a
              class="link"
              href="#"
            >
              photo
            </a>
          </li>

          <li class="nav_1 video">
            <a
              class="link"
              href="#"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
