<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="/"
        class="logo"
      >
        <img
          src="images/logo.png"
          alt="Moyo logo"
        />
      </a>

      <nav class="nav">
        <a
          href="#"
          class="nav__link is-active"
        >
          Apple
        </a>
        <a
          href="#"
          class="nav__link"
        >
          Samsung
        </a>
        <a
          href="#"
          class="nav__link"
        >
          Smartphones
        </a>
        <a
          href="#"
          class="nav__link"
        >
          Laptops
        </a>
        <a
          href="#"
          class="nav__link"
          data-qa="hover"
        >
          Gadgets
        </a>
        <a
          href="#"
          class="nav__link"
        >
          Tablets
        </a>
        <a
          href="#"
          class="nav__link"
        >
          Photo
        </a>
        <a
          href="#"
          class="nav__link"
        >
          Video
        </a>
      </nav>
    </header>
  </body>
</html>
