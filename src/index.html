<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <a
        class="logo"
        href="#logo"
      >
        <img
          src="./images/logo.png"
          alt="Moyo-logo"
        />
      </a>

      <nav class="navigation">
        <ul class="nav-list">
          <li class="nav">
            <a
              class="page page-1 is-active"
              href="#apple"
            >
              Apple
            </a>
          </li>
          <li class="nav">
            <a
              class="page page-2"
              href="#samsung"
            >
              Samsung
            </a>
          </li>
          <li class="nav">
            <a
              class="page page-3"
              href="#smartphones"
            >
              Smartphones
            </a>
          </li>
          <li class="nav">
            <a
              class="page page-4"
              href="#laptops&amp;computers"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav">
            <a
              class="page page-5"
              href="#gadgets"
            >
              Gadgets
            </a>
          </li>
          <li class="nav">
            <a
              class="page page-6"
              href="#tablets"
            >
              Tablets
            </a>
          </li>
          <li class="nav">
            <a
              class="page page-7"
              href="#photo"
            >
              Photo
            </a>
          </li>
          <li class="nav">
            <a
              class="page page-8"
              href="#video"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
