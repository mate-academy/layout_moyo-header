<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__container">
        <a
          href="#"
          class="header__logo-link"
        >
          <img
            class="header__image-logo"
            src="./images/logo.png"
            alt="moyo logo"
          />
        </a>
        <nav class="header__nav">
          <ul class="header__list">
            <li class="header__item">
              <a
                href="#"
                class="header__link is-active"
              >
                apple
              </a>
            </li>
            <li class="header__item">
              <a
                href="#"
                class="header__link"
              >
                samsung
              </a>
            </li>
            <li class="header__item">
              <a
                href="#"
                class="header__link"
              >
                smartphones
              </a>
            </li>
            <li class="header__item">
              <a
                href="#"
                class="header__link"
                data-qa="hover"
              >
                laptops&computers
              </a>
            </li>
            <li class="header__item">
              <a
                href="#"
                class="header__link"
              >
                gadgets
              </a>
            </li>
            <li class="header__item">
              <a
                href="#"
                class="header__link"
              >
                tablets
              </a>
            </li>
            <li class="header__item">
              <a
                href="#"
                class="header__link"
              >
                photo
              </a>
            </li>
            <li class="header__item">
              <a
                href="#"
                class="header__link"
              >
                video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
