<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <body>
    <header class="main-header">
      <a
        href="#"
        class="header-logo-link"
      >
        <img
          src="./images/logo.png"
          class="header-img-logo"
          alt="Moyo logo"
        />
      </a>

      <nav class="header-nav">
        <ul class="header-nav-list">
          <li class="header-nav-item">
            <a
              href="#"
              class="header-nav-link is-active"
            >
              Apple
            </a>
          </li>

          <li class="header-nav-item">
            <a
              href="#"
              class="header-nav-link"
            >
              Samsung
            </a>
          </li>

          <li class="header-nav-item">
            <a
              href="#"
              class="header-nav-link"
            >
              Smartphones
            </a>
          </li>

          <li class="header-nav-item">
            <a
              href="#"
              class="header-nav-link"
              data-qa="hover"
            >
              Laptops &amp; Computers
            </a>
          </li>

          <li class="header-nav-item">
            <a
              href="#"
              class="header-nav-link"
            >
              Gadgets
            </a>
          </li>

          <li class="header-nav-item">
            <a
              href="#"
              class="header-nav-link"
            >
              Tablets
            </a>
          </li>

          <li class="header-nav-item">
            <a
              href="#"
              class="header-nav-link"
            >
              Photo
            </a>
          </li>

          <li class="header-nav-item">
            <a
              href="#"
              class="header-nav-link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
