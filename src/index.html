<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="*"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body>
    <header>
      <div class="container">
        <a
          href="#"
          class="logo"
        >
          <img
            src="images/logo.png"
            alt="Moyo Logo"
          />
        </a>
        <nav>
          <ul>
            <li>
              <a
                href="#"
                class="is-active"
              >
                Apple
              </a>
            </li>
            <li><a href="#">Samsung</a></li>
            <li><a href="#">Smartphones</a></li>
            <li>
              <a
                href="#"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li><a href="#">Gadgets</a></li>
            <li><a href="#">Tablets</a></li>
            <li><a href="#">Photo</a></li>
            <li><a href="#">Video</a></li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
