<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <title>MOYO Header</title>
  </head>
  <body>
    <header class="header">
      <a
        href="#"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="MOYO logo"
        />
      </a>

      <nav class="nav">
        <ul class="nav__list">
          <li>
            <a
              class="nav__link is-active"
              href="#"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="#"
            >
              TV & audio
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="#"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>
          <li>
            <a
              class="nav__link"
              href="#"
            >
              Accessories
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
