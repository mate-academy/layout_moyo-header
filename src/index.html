<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500&display=swap"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body class="page">
    <header class="header">
      <a
        href="#"
        class="header__logo"
      >
        <img
          src="./images/logo.png"
          alt="Moyo company logo"
          class="header__logo-img"
        />
      </a>

      <nav class="header__nav">
        <ul class="header__list">
          <li class="header__item">
            <a
              href="#"
              class="header__link is-active"
            >
              apple
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              samsung
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              smartphones
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              gadgets
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              tablets
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              photo
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
