<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        class="logo"
        href="index.html"
      >

      </a>
      <nav class="nav">
        <ul class="list-nav">
          <li>
            <a
              href="#"
              class="is-active"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              href="#"
              class="item"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              href="#"
              class="item"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              href="#"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li>
            <a
              href="#"
              class="item"
            >
              Gadgets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="item"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="item"
            >
              Photo
            </a>
          </li>
          <li>
            <a
              href="#"
              class="item"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
