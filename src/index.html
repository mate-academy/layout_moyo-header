<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Document</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        class="img_link"
        href="#logo"
      >
        <img
          src="images/logo.png"
          alt="logo"
        />
      </a>

      <nav class="list">
        <a
          href="#apple"
          class="is-active nav__link"
        >
          Apple
        </a>
        <a
          href="#sumsung"
          class="nav__link"
        >
          Samsung
        </a>
        <a
          href="#smartphones"
          class="nav__link"
        >
          Smartphones
        </a>
        <a
          href="#laptops"
          data-qa="hover"
          class="nav__link"
        >
          Laptops & Computers
        </a>
        <a
          href="#gadgets"
          class="nav__link"
        >
          Gadgets
        </a>
        <a
          href="#tablets"
          class="nav__link"
        >
          Tablets
        </a>
        <a
          href="#photo"
          class="nav__link"
        >
          Photo
        </a>
        <a
          href="#video"
          class="nav__link"
        >
          Video
        </a>
      </nav>
    </header>
  </body>
</html>
