<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>MOYO Header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="moyo-header">
      <a
        href="index.html"
        class="moyo-header__logo-link"
      >
        <img
          src="./images/logo.png"
          alt="MOYO Logo"
          class="moyo-header__logo"
        />
      </a>

      <nav class="moyo-header__nav">
        <ul class="moyo-header__nav-list">
          <li class="moyo-header__nav-item">
            <a
              href="#"
              class="moyo-header__nav-link is-active"
            >
              apple
            </a>
          </li>
          <li class="moyo-header__nav-item">
            <a
              href="#"
              class="moyo-header__nav-link"
            >
              samsung
            </a>
          </li>
          <li class="moyo-header__nav-item">
            <a
              href="#"
              class="moyo-header__nav-link"
            >
              smartphones
            </a>
          </li>
          <li class="moyo-header__nav-item">
            <a
              href="#"
              class="moyo-header__nav-link"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>
          <li class="moyo-header__nav-item">
            <a
              href="#"
              class="moyo-header__nav-link"
            >
              gadgets
            </a>
          </li>
          <li class="moyo-header__nav-item">
            <a
              href="#"
              class="moyo-header__nav-link"
            >
              tablets
            </a>
          </li>
          <li class="moyo-header__nav-item">
            <a
              href="#"
              class="moyo-header__nav-link"
            >
              photo
            </a>
          </li>
          <li class="moyo-header__nav-item">
            <a
              href="#"
              class="moyo-header__nav-link"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
