<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>MOYO Header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="page-header">
      <div class="header-content">
        <a
          href="#"
          class="logo"
        >
          <img
            alt="MOYO online store logo"
            class="logo-image"
            src="moyo-10.png"
          />
        </a>
        <nav class="main-nav">
          <ul class="nav-list">
            <li class="nav-item">
              <a
                href="#"
                class="nav-link is-active"
              >
                Apple
              </a>
            </li>
            <li class="nav-item">
              <a
                href="#"
                class="nav-link"
              >
                Samsung
              </a>
            </li>
            <li class="nav-item">
              <a
                href="#"
                class="nav-link"
              >
                Smartphones
              </a>
            </li>
            <li class="nav-item">
              <a
                href="#"
                class="nav-link"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li class="nav-item">
              <a
                href="#"
                class="nav-link"
              >
                Gadgets
              </a>
            </li>
            <li class="nav-item">
              <a
                href="#"
                class="nav-link"
              >
                Tablets
              </a>
            </li>
            <li class="nav-item">
              <a
                href="#"
                class="nav-link"
              >
                Photo
              </a>
            </li>
            <li class="nav-item">
              <a
                href="#"
                class="nav-link"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
