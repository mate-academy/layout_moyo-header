<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body id="top">
    <header class="header">
      <a href="#top">
        <img
          src="./images/logo.png"
          alt="logo"
          class="img"
        />
      </a>

      <nav class="nav">
        <ul class="list">
          <li class="a">
            <a
              href="#apple"
              class="is-active link"
            >
              APPLE
            </a>
          </li>

          <li class="links">
            <a
              href="#samsung"
              class="link"
            >
              SAMSUNG
            </a>
          </li>

          <li class="links">
            <a
              href="#smartphones"
              class="link"
            >
              SMARTPHONES
            </a>
          </li>

          <li class="links">
            <a
              href="#laptops&computers"
              class="link"
              data-qa="hover"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>

          <li class="links">
            <a
              href="#gadgets"
              class="link"
            >
              GADGETS
            </a>
          </li>

          <li class="links">
            <a
              href="#tablets"
              class="link"
            >
              TABLETS
            </a>
          </li>

          <li class="links">
            <a
              href="#photo"
              class="link"
            >
              PHOTO
            </a>
          </li>

          <li class="links">
            <a
              href="#video"
              class="link"
            >
              VIDEO
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
