<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles.css"
    />
  </head>
  <body>
    <header class="page-header">
      <a
        href="/"
        class="header-logo"
      >
        <img
          src="images/logo.png"
          class="header-logo__img"
          alt="Logo MOYO sklep"
        />
      </a>
      <nav class="header-nav">
        <ul class="nav-list">
          <li class="nav-list__item">
            <a
              href="#"
              class="nav-link is-active"
            >
              Apple
            </a>
          </li>
          <li class="nav-list__item">
            <a
              href="#"
              class="nav-link"
            >
              Samsung
            </a>
          </li>
          <li class="nav-list__item">
            <a
              href="#"
              class="nav-link"
            >
              Smartphones
            </a>
          </li>
          <li class="nav-list__item">
            <a
              href="#"
              class="nav-link"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>
          <li class="nav-list__item">
            <a
              href="#"
              class="nav-link"
            >
              Gadgets
            </a>
          </li>
          <li class="nav-list__item">
            <a
              href="#"
              class="nav-link"
            >
              Tablets
            </a>
          </li>
          <li class="nav-list__item">
            <a
              href="#"
              class="nav-link"
            >
              Photo
            </a>
          </li>
          <li class="nav-list__item">
            <a
              href="#"
              class="nav-link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
