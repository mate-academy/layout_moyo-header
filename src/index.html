<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        class="linkWithLogo"
        href="#"
      >
        <img
          class="logoImg"
          src="./images/logo.png"
          alt="logo"
        />
      </a>
      <nav class="nav">
        <ul class="navList">
          <li class="navItem">
            <a
              class="navLink is-active"
              href="#Apple"
            >
              Apple
            </a>
          </li>
          <li class="navItem">
            <a
              class="navLink"
              href="#Samsung"
            >
              Samsung
            </a>
          </li>
          <li class="navItem">
            <a
              class="navLink"
              href="#Smartphones"
            >
              Smartphones
            </a>
          </li>
          <li class="navItem">
            <a
              class="navLink"
              data-qa="hover"
              href="#Laptops & Computers"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="navItem">
            <a
              class="navLink"
              href="#Gadgets"
            >
              Gadgets
            </a>
          </li>
          <li class="navItem">
            <a
              class="navLink"
              href="#Tablets"
            >
              Tablets
            </a>
          </li>
          <li class="navItem">
            <a
              class="navLink"
              href="#Photo"
            >
              Photo
            </a>
          </li>
          <li class="navItem">
            <a
              class="navLink"
              href="#Video"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
