<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo header</title>
    <!-- Roboto 500 only, roman, normal -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="#"
        class="header__logo"
      >
        <img
          src="images/logo.svg"
          alt="Moyo logo"
        />
      </a>
      <nav class="header__nav">
        <ul class="header__list">
          <li><a href="#">Smartphones</a></li>
          <li><a href="#">TV & Audio</a></li>
          <li><a href="#">Appliances</a></li>
          <li>
            <a
              href="#"
              class="is-active"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li><a href="#">Gaming</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>
