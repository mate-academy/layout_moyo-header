<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@501&display=swap"
      rel="stylesheet"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <div class="wrapper">
        <div class="img-container">
          <a href="#">
            <img
              src="./images/logo.png"
              alt="logo"
            />
          </a>
        </div>
        <nav>
          <a
            class="is-active"
            href="#Apple"
          >
            Apple
          </a>
          <a href="#Samsung">Samsung</a>
          <a href="#Smartphones">Smartphones</a>
          <a
            data-qa="hover"
            href="#Laptops & Computers"
          >
            Laptops & Computers
          </a>
          <a href="#Gadgets">Gadgets</a>
          <a href="#Tablets">Tablets</a>
          <a href="#Photo">Photo</a>
          <a href="#Video">Video</a>
        </nav>
      </div>
    </header>
  </body>
</html>
