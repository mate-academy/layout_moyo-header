<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo Header</title>

    <link
      rel="stylesheet"
      href="./style.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header">
      <a
        href="index.html"
        class="logo-link"
      >
        <img
          src="./images/logo.png"
          alt="MOYO logo"
          class="logo-img"
        />
      </a>

      <nav class="nav">
        <ul class="header-links">
          <li class="header-item">
            <a
              href="#"
              class="header-link is-active"
            >
              Apple
            </a>
          </li>
          <li class="header-item">
            <a
              href="#"
              class="header-link"
            >
              Samsung
            </a>
          </li>
          <li class="header-item">
            <a
              href="#"
              class="header-link"
            >
              Smartphones
            </a>
          </li>
          <li class="header-item">
            <a
              href="#"
              class="header-link"
              data-qa="hover"
            >
              Laptops &amp; Computers
            </a>
          </li>
          <li class="header-item">
            <a
              href="#"
              class="header-link"
            >
              Gadgets
            </a>
          </li>
          <li class="header-item">
            <a
              href="#"
              class="header-link"
            >
              Tablets
            </a>
          </li>
          <li class="header-item">
            <a
              href="#"
              class="header-link"
            >
              Photo
            </a>
          </li>
          <li class="header-item">
            <a
              href="#"
              class="header-link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
