<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="#"
        class="header_logo"
      >
        <img
          src="images/logo.png"
          alt="logo"
          class="logo"
        />
      </a>
      <nav
        class="header__nav"
        aria-label="Main navigation"
      >
        <ul class="header__list">
          <li class="header__item">
            <a
              href="#"
              class="header__link is-active"
            >
              Apple
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              Samsung
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              Smartphones
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              Gadgets
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              Tablets
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              Photo
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
