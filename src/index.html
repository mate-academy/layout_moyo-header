<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a href="#logo">
        <img
          class="img"
          src="images/logo.png"
          alt="logo"
        />
      </a>
      <nav>
        <ul class="nav">
          <li class="nav__link is-active">
            <a
              class="nav__link__item is-active"
              href="#apple-section"
            >
              APPLE
            </a>
          </li>
          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#samsung-section"
            >
              SAMSUNG
            </a>
          </li>
          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#smartphones-section"
            >
              SMARTPHONES
            </a>
          </li>
          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#laptops&computers-section"
              data-qa="hover"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>
          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#dargets-section"
            >
              GADGETS
            </a>
          </li>
          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#gadgets-section"
            >
              TABLETS
            </a>
          </li>
          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#photo-section"
            >
              PHOTO
            </a>
          </li>
          <li class="nav__link">
            <a
              class="nav__link__item"
              href="#video-section"
            >
              VIDEO
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
