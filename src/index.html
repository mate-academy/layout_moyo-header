<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>

    <!--Roboto font link starts-->

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <!--Roboto font link ends-->

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <!--Header starts-->
    <header class="header">
      <!--MOYO logo-->
      <a href="#">
        <img
          src="/src/images/logo.png"
          alt="logo"
          class="logo"
        />
      </a>

      <!--Nav Bar-->
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__link">
            <a
              href="#"
              class="is-active"
            >
              Apple
            </a>
          </li>

          <li class="nav__link">
            <a href="#">Samsung</a>
          </li>

          <li class="nav__link">
            <a href="#">Smartphones</a>
          </li>

          <li class="nav__link">
            <a
              href="#"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>

          <li class="nav__link">
            <a href="#">Gadgets</a>
          </li>

          <li class="nav__link">
            <a href="#">Tablets</a>
          </li>

          <li class="nav__link">
            <a href="#">Photo</a>
          </li>

          <li class="nav__link">
            <a href="#">Video</a>
          </li>
        </ul>
      </nav>
    </header>

    <!--Header ends-->
  </body>
</html>
