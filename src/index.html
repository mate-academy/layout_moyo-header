<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
    <title>MOYO header</title>
  </head>

  <body>
    <header
      class="header"
      data-cy="header"
    >
      <a
        class="header__logo-link"
        href="#"
        data-cy="logo"
      >
        <img
          src="./images/logo.png"
          alt="MOYO"
          class="header__logo"
        />
      </a>

      <nav
        class="nav"
        data-cy="nav"
      >
        <ul
          class="nav__list"
          data-cy="nav-list"
        >
          <li class="nav__item">
            <a
              href="#"
              class="nav__link is-active"
            >
              Apple
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="#"
              data-cy="samsung"
            >
              Samsung
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="#"
              data-cy="smartphones"
            >
              Smartphones
            </a>
          </li>

          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
              data-qa="hover"
            >
              Laptops &amp; computers
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="#"
              data-cy="gadgets"
            >
              Gadgets
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="#"
              data-cy="tablets"
            >
              Tablets
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="#"
              data-cy="photo"
            >
              Photo
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="#"
              data-cy="video"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
