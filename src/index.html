<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>MOYO Header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header>
      <div class="header-container">
        <a
          href="/"
          class="logo-link"
        >
          <img
            src="logo.png"
            alt="Logo MOYO"
          />
        </a>
        <nav>
          <ul class="nav-list">
            <li>
              <a
                href="#"
                class="nav-link is-active"
              >
                Apple
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Samsung
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Smartphones
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Gadgets
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Tablets
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Photo
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
