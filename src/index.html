<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body class="container">
    <header class="header">
      <div class="logo--wrapper">
        <a href="#Home">
          <img
            src="./images/logo.png"
            alt="moyo-logo"
          />
        </a>
      </div>
      <nav class="nav--wrapper">
        <ul class="navigation">
          <li class="nav--li">
            <a
              class="nav--link is-active"
              href="#Apple"
            >
              apple
            </a>
          </li>

          <li class="nav--li">
            <a
              class="nav--link"
              href="#Samsung"
            >
              samsung
            </a>
          </li>

          <li class="nav--li">
            <a
              class="nav--link"
              href="#Smartphones"
            >
              smartphones
            </a>
          </li>

          <li class="nav--li">
            <a
              class="nav--link"
              href="#Laptops"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>

          <li class="nav--li">
            <a
              class="nav--link"
              href="#Gadgets"
            >
              gadgets
            </a>
          </li>

          <li class="nav--li">
            <a
              class="nav--link"
              href="#Tablets"
            >
              tablets
            </a>
          </li>

          <li class="nav--li">
            <a
              class="nav--link"
              href="#Photo"
            >
              photo
            </a>
          </li>

          <li class="nav--li">
            <a
              class="nav--link"
              href="#Video"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
