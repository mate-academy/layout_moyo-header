<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"

          <li>

          </li>
          <li>
            <a class="url">SMARTPHONES</a>
          </li>
          <li>
            <a
              class="url url4"
              data-qa="hover"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>
          <li>
            <a class="url">GADGETS</a>
          </li>
          <li>
            <a class="url">TABLETS</a>
          </li>
          <li>
            <a class="url">PHOTO</a>
          </li>
          <li>

        </ul>
