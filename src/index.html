<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="index.html">
          <img
            class="image-logo"
            src="images/logo.png"
            alt="Moyo logo"
          />
        </a>
        <nav class="header-nav">
          <ul class="header-nav-list">
            <li class="header-nav-item">
              <a
                class="item-text is-active"
                href="#"
              >
                apple
              </a>
            </li>
            <li class="header-nav-item">
              <a
                class="item-text"
                href="#"
              >
                samsung
              </a>
            </li>
            <li class="header-nav-item">
              <a
                class="item-text"
                href="#"
              >
                smartphones
              </a>
            </li>
            <li class="header-nav-item">
              <a
                class="item-text"
                data-qa="hover"
                href="#"
              >
                laptops & computers
              </a>
            </li>
            <li class="header-nav-item">
              <a
                class="item-text"
                href="#"
              >
                gadgets
              </a>
            </li>
            <li class="header-nav-item">
              <a
                class="item-text"
                href="#"
              >
                tablets
              </a>
            </li>
            <li class="header-nav-item">
              <a
                class="item-text"
                href="#"
              >
                photo
              </a>
            </li>
            <li class="header-nav-item">
              <a
                class="item-text"
                href="#"
              >
                video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
