<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo Header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="#"
        class="header__logo"
      >
        <img
          src="/src/images/logo.png"
          alt="Logo"
        />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li>
            <a
              href="#"
              class="nav__links is-active"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__links"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__links"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__links"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__links"
            >
              Gadgets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__links"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__links"
            >
              Photo
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__links"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
