<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta

    />
    <meta

      content="ie=edge"

    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"

    <link

    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

            <li class="link">

            <li class="link">
              <a href="">GADGETS</a>

            <li class="link">

            <li class="link">
