<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="index.html">
          <img

        </a>
        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a
                href="#"
                class="nav__link is-active"
                target="_blank"
              >
                Apple
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
                target="_blank"
              >
                Samsung
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
                target="_blank"
              >
                Smartphones
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
                target="_blank"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
                target="_blank"
              >
                Gadgets
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
                target="_blank"
              >
                Tablets
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
                target="_blank"
              >
                Photo
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
                target="_blank"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
      <!-- ./container -->
    </header>
  </body>
</html>
