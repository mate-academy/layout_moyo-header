<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/style.css"
    />
    <title>MOYO Header</title>
  </head>
  <body>
    <header class="header">
      <a
        href="#"
        class="logo-link"
      >
        <img
          src="images/logo.png"
          alt="Moyo Logo"
          class="logo-img"
        />
      </a>

      <nav class="nav">
        <ul class="nav_list">
          <li class="nav_item">
            <a
              class="nav_link is-active"
              href="#"
            >
              Apple
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Samsung
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Gadgets
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Tablets
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Photo
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
