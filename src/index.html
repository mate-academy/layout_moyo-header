<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo Header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="#logo"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="Moyo logo"
        />
      </a>

      <nav class = "navigation">
        <ul class = "navigation__list">
          <li class = "navigation__item">
            <a href="#apple" class="is-active link">
              Apple
            </a>
          </li>
          <li class = "navigation__item"><a class="link" href="#samsung">Samsung</a></li>
          <li class = "navigation__item"><a class="link" href="#smartphones">Smartphones</a></li>
          <li class = "navigation__item">
            <a
              class="link"
              href="#laptop"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>
          <li class = "navigation__item"><a class="link" href="#gadgets">Gadgets</a></li>
          <li class = "navigation__item"><a class="link" href="#tablets">Tablets</a></li>
          <li class = "navigation__item"><a class="link" href="#photo">Photo</a></li>
          <li class = "navigation__item"><a class="link" href="#video">Video</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>
