
<!doctype html>
<html lang="uk">
  <head>

    <meta
      name="viewport"

    />

    <title>Moyo Header</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"

    />

      <nav>
        <ul class="nav-menu">

            <a
              href="#apple"
              class="nav-link is-active"

          <li class="nav-item">
            <a
              href="#samsung"
              class="nav-link"
            >
              Samsung
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#smartphones"
              class="nav-link"
            >
              Smartphones
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#gadgets"
              class="nav-link"
            >
              Gadgets
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#tablets"
              class="nav-link"
            >
              Tablets
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#photo"
              class="nav-link"
            >
              Photo
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#video"
              class="nav-link"
            >
              Video
            </a>
          </li>
        </ul>
