<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"

    />

            </a>
          </li>
          <li>
            <a

              Smartphones
            </a>
          </li>
          <li>
            <a

            </a>
          </li>
          <li>

              class="castome_underline"
              href="#Gadgets"

              Gadgets
            </a>
          </li>
          <li>
            <a
              class="castome_underline"
              href="#Tablets"
            >

            </a>
          </li>
          <li>
            <a

            </a>
          </li>
          <li>
            <a

          </li>
        </ul>
      </nav>
