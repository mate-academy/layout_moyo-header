<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>MOYO Header - Exemplo</title>

    <!-- Fonte Roboto (500) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- CSS externo -->
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header
      class="site-header"
      role="banner"
    >
      <div class="container">
        <a
          class="logo"
          href="#"
          aria-label="MOYO - Início"
        >
          <svg
            viewBox="0 0 200 40"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            focusable="false"
          >
            <rect
              width="200"
              height="40"
              rx="6"
              fill="#111"
            />
            <text
              x="18"
              y="26"
              font-family="Roboto, Arial"
              font-weight="500"
              font-size="18"
              fill="#fff"
            >
              MOYO
            </text>
          </svg>
        </a>

        <nav
          role="navigation"
          aria-label="Menu principal"
        >
          <ul
            class="nav-list"
            role="menubar"
          >
            <li
              class="nav-item"
              role="none"
            >
              <a
                class="nav-link is-active"
                href="#"
                role="menuitem"
              >
                Home
              </a>
            </li>
            <li
              class="nav-item"
              role="none"
            >
              <a
                class="nav-link"
                href="#"
                role="menuitem"
              >
                Smartphones
              </a>
            </li>
            <li
              class="nav-item"
              role="none"
            >
              <a
                class="nav-link"
                href="#"
                role="menuitem"
              >
                Tablets
              </a>
            </li>
            <li
              class="nav-item"
              role="none"
            >
              <a
                class="nav-link"
                href="#"
                role="menuitem"
                data-qa="hover"
              >
                Laptops &amp; computers
              </a>
            </li>
            <li
              class="nav-item"
              role="none"
            >
              <a
                class="nav-link"
                href="#"
                role="menuitem"
              >
                Accessories
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
