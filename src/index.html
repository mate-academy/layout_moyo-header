<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <body>
    <header
      id="page_top"
      class="header"
    >
      <a
        class="home_icon"
        href="#page_top"
      >
        <img
          src="./images/logo.png"
          alt="Moyo company logo"
        />
      </a>
      <nav class="nav">
        <ul class="list_menu">
          <li class="list_item">
            <a
              class="list_link is-active"
              href="#page_top"
            >
              apple
            </a>
          </li>
          <li class="list_item">
            <a
              class="list_link"
              href="#page_top"
            >
              samsung
            </a>
          </li>
          <li class="list_item">
            <a
              class="list_link"
              href="#page_top"
            >
              smartphones
            </a>
          </li>
          <li class="list_item">
            <a
              class="list_link"
              href="#page_top"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>
          <li class="list_item">
            <a
              class="list_link"
              href="#page_top"
            >
              gadgets
            </a>
          </li>
          <li class="list_item">
            <a
              class="list_link"
              href="#page_top"
            >
              tablets
            </a>
          </li>
          <li class="list_item">
            <a
              class="list_link"
              href="#page_top"
            >
              photo
            </a>
          </li>
          <li class="list_item">
            <a
              class="list_link"
              href="#page_top"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
