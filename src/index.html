<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo header</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet">
    <link
      rel="stylesheet"
      href="./style.css">
  </head>
  <body>
    <h1 class="visually-hidden">Moyo header</h1>

    <header>
      <div class="nav-wrapper">
        <a
          href="/"
          class="logo"
        >
          <img
            src="images/logo.png"
            alt="Company Logo"
          />
        </a>

        <nav>
          <ul class="nav-list">
            <li>
              <a
                href="#"
                class="nav-link is-colored is-active"
              >
                Apple
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Samsung
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Smartphones
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Gadgets
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Tablets
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Photo
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
