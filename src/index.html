<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="index.html"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="logo"
          class="image"
        />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              href="index.html"
              class="nav__link is-active"
            >
              <div class="item-text1">Apple</div>
            </a>
          </li>

          <li class="nav__item">
            <a
              href="samsung_page"
              class="nav__link"
            >
              <div class="item-text2">Samsung</div>
            </a>
          </li>

          <li class="nav__item">
            <a
              href="smartphones_page"
              class="nav__link"
            >
              <div class="item-text3">Smartphones</div>
            </a>
          </li>

          <li class="nav__item">
            <a
              href="laptops_and_computers_page"
              class="nav__link"
              data-qa="hover"
            >
              <div class="item-text4">Laptops & Computers</div>
            </a>
          </li>

          <li class="nav__item">
            <a
              href="gadgets_page"
              class="nav__link"
            >
              <div class="item-text5">Gadgets</div>
            </a>
          </li>

          <li class="nav__item">
            <a
              href="tablets_page"
              class="nav__link"
            >
              <div class="item-text6">Tablets</div>
            </a>
          </li>

          <li class="nav__item">
            <a
              href="photo_page"
              class="nav__link"
            >
              <div class="item-text7">Photo</div>
            </a>
          </li>

          <li class="nav__item">
            <a
              href="video_page"
              class="nav__link"
            >
              <div class="item-text8">Video</div>
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
