<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <title>Moyo header</title>
  </head>
  <body>
    <header class="header">
      <a href="#">
        <img
          class="logo"
          src="/src/images/logo.png"
          alt="logo_moyo"
        />
      </a>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              class="nav__link is-active"
              href="#apple"
            >
              apple
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#samsung"
            >
              samsung
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#smartphones"
            >
              smartphones
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#laptops"
              class="nav__link"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#gadgets"
            >
              gadgets
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#tablets"
            >
              tablets
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#photo"
            >
              photo
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#video"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
