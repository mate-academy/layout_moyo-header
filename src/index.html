<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="container">
      <div class="logo">
        <a href="#">
          <img
            src="images/logo.png"
            width="40"
            height="40"
            alt="noimg"
          />
        </a>
      </div>
      <nav class="nav">
        <ul class="box">
          <li class="li">
            <a
              class="link1 link is-active"
              href="#"
            >
              Apple
            </a>
          </li>
          <li class="li">
            <a
              class="link2 link"
              href="#"
            >
              Samsung
            </a>
          </li>
          <li class="li">
            <a
              class="link3 link"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li class="li">
            <a
              class="link4 link"
              data-qa="hover"
              href="#"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="li">
            <a
              class="link5 link"
              href="#"
            >
              Gadgets
            </a>
          </li>
          <li class="li">
            <a
              class="link6 link"
              href="#"
            >
              Tablets
            </a>
          </li>
          <li class="li">
            <a
              class="link7 link"
              href="#"
            >
              Photo
            </a>
          </li>
          <li class="li">
            <a
              class="link8 link"
              href="#"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
