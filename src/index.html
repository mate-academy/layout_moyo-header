<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>MOYO Header</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header>
      <a
        href="/"
        class="logo-link"
        aria-label="MOYO Home"
      >
        <img
          src="images/logo.png"
          alt="MOYO Logo"
        />
      </a>
      <nav>
        <ul
          class="menu"
          role="menubar"
          aria-label="Primary navigation"
        >
          <li role="none">
            <a
              href="#"
              role="menuitem"
              class="is-active"
            >
              Apple
            </a>
          </li>
          <li role="none">
            <a
              href="#"
              role="menuitem"
            >
              Samsung
            </a>
          </li>
          <li role="none">
            <a
              href="#"
              role="menuitem"
            >
              Smartphones
            </a>
          </li>
          <li role="none">
            <a
              href="#"
              role="menuitem"
              data-qa="hover"
            >
              Laptops &amp; Computers
            </a>
          </li>
          <li role="none">
            <a
              href="#"
              role="menuitem"
            >
              Gadgets
            </a>
          </li>
          <li role="none">
            <a
              href="#"
              role="menuitem"
            >
              Tablets
            </a>
          </li>
          <li role="none">
            <a
              href="#"
              role="menuitem"
            >
              Photo
            </a>
          </li>
          <li role="none">
            <a
              href="#"
              role="menuitem"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
