<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <title>Moyo Header</title>

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="#">
          <img
            src="./images/logo.png"
            alt="moyo logo"
            class="logo"
          />
        </a>

        <nav>
          <ul class="nav_list">
            <li class="nav_items">
              <a
                class="nav_links is-active"
                href="#"
              >
                Apple
              </a>
            </li>
            <li class="nav_items">
              <a
                class="nav_links"
                href="#"
              >
                Samsung
              </a>
            </li>
            <li class="nav_items">
              <a
                class="nav_links"
                href="#"
              >
                Smartphones
              </a>
            </li>
            <li class="nav_items">
              <a
                class="nav_links"
                data-qa="hover"
                href="#"
              >
                Laptops & Computers
              </a>
            </li>
            <li class="nav_items">
              <a
                class="nav_links"
                href="#"
              >
                Gadgets
              </a>
            </li>
            <li class="nav_items">
              <a
                class="nav_links"
                href="#"
              >
                Tablets
              </a>
            </li>
            <li class="nav_items">
              <a
                class="nav_links"
                href="#"
              >
                Photo
              </a>
            </li>
            <li class="nav_items">
              <a
                class="nav_links"
                href="#"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
