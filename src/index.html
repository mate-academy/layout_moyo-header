<!doctype html>
<html lang="en">
  <!-- #region HEADER -->
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <!-- #endregion HEADER -->
  <body>
    <header class="header">
      <!-- HEADER -->
      <!-- <div class="logo__link"> LOGO -->
      <a
        href="#"
        class="a__logo"
      >
        <img
          src="images/logo.png"
          alt="MOYO_logo"
          class="moyo__logo"
        />
        <!-- LOGO IMAGE -->
      </a>
      <!-- </div> -->
      <nav class="nav">
        <!-- NAVIGATION -->
        <ul class="list">
          <li class="list__items">
            <!-- ITEM 1 -->
            <a
              href="#apple"
              class="links is-active"
            >
              apple
            </a>
          </li>
          <li class="list__items">
            <!-- ITEM 2 -->
            <a
              href="#samsung"
              class="links"
            >
              samsung
            </a>
          </li>
          <li class="list__items">
            <!-- ITEM 3 -->
            <a
              href="#smartphones"
              class="links"
            >
              smartphones
            </a>
          </li>
          <li class="list__items">
            <!-- ITEM 4 -->
            <a
              href="#laptops&computers"
              class="links"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>
          <li class="list__items">
            <!-- ITEM 5 -->
            <a
              href="#gadgets"
              class="links"
            >
              gadgets
            </a>
          </li>
          <li class="list__items">
            <!-- ITEM 6 -->
            <a
              href="#tablets"
              class="links"
            >
              tablets
            </a>
          </li>
          <li class="list__items">
            <!-- ITEM 7 -->
            <a
              href="#photo"
              class="links"
            >
              photo
            </a>
          </li>
          <li class="list__items">
            <!-- ITEM 8 -->
            <a
              href="#video"
              class="links"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
