<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="moyo-header">
      <a
        href="#"
        class="header__logo"
      >
        <img
          class="header__logo-img"
          src="images/logo.png"
          alt="Moyo logo"
        />
      </a>
      <nav class="navigation">
        <ul class="navigation__links">
          <li class="navigation__link">
            <a href="#" class="is-active">Apple</a>
          </li>
          <li class="navigation__link">
            <a href="#"class="navigation__link-anchor">Samsung</a>
          </li>
          <li class="navigation__link">
            <a href="#" class="navigation__link-anchor">Smartphones</a>
          </li>
          <li class="navigation__link">
            <a
              class="navigation__link-anchor"
              href="#"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>
          <li class="navigation__link">
            <a href="#" class="navigation__link-anchor">Gadgets</a>
          </li>
          <li class="navigation__link">
            <a href="#" class="navigation__link-anchor">Tablets</a>
          </li>
          <li class="navigation__link">
            <a href="#" class="navigation__link-anchor">Photo</a>
          </li>
          <li class="navigation__link">
            <a href="#" class="navigation__link-anchor">Video</a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
