<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="linthtml"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header header-1200px">
      <a href="https://www.moyo.ua/">
        <img
          src="images/logo.png"
          alt="Logo"
          class="logo"
        />
      </a>

      <nav class="nav nav-1200px">
        <ul class="nav-list nav-list-1200px">
          <li class="nav-link nav-link-1200px is-active">APPLE</li>
          <li class="nav-link nav-link-1200px">SAMSUNG</li>
          <li class="nav-link nav-link-1200px">SMARTPHONES</li>
          <li
            class="nav-link nav-link-1200px fourth-link"
            data-qa="hover"
          >
            LAPTOPS&COMPUTERS
          </li>
          <li class="nav-link nav-link-1200px">GADGETS</li>
          <li class="nav-link nav-link-1200px">TABLETS</li>
          <li class="nav-link nav-link-1200px">PHOTO</li>
          <li class="nav-link nav-link-1200px">VIDEO</li>
        </ul>
      </nav>
    </header>

    <header class="header header-1024px">
      <a href="https://www.moyo.ua/">
        <img
          src="images/logo.png"
          alt="Logo"
          class="logo"
        />
      </a>

      <nav class="nav nav-1024px">
        <ul class="nav-list nav-list-1024px">
          <li class="nav-link nav-link-1024px is-active">APPLE</li>
          <li class="nav-link nav-link-1024px">SAMSUNG</li>
          <li class="nav-link nav-link-1024px">SMARTPHONES</li>
          <li
            class="nav-link nav-link-1024px fourth-link"
            data-qa="hover"
          >
            LAPTOPS&COMPUTERS
          </li>
          <li class="nav-link nav-link-1024px">GADGETS</li>
          <li class="nav-link nav-link-1024px">TABLETS</li>
          <li class="nav-link nav-link-1024px">PHOTO</li>
          <li class="nav-link nav-link-1024px">VIDEO</li>
        </ul>
      </nav>
    </header>

    <h1>Moyo header</h1>
  </body>
</html>
