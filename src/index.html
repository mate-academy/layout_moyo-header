<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <a href="./images/logo.png">
        <img
          class="logo"
          src="./images/logo.png"
          alt="Moyo logo"
        />
      </a>
      <nav>
        <ul class="menu">
          <li class="menu_item">
            <a
              href="#Apple"
              class="menu_link is-active"
            >
              Apple
            </a>
          </li>
          <li class="menu_item">
            <a
              class="menu_link"
              href="#Samsung"
            >
              Samsung
            </a>
          </li>
          <li class="menu_item">
            <a
              class="menu_link"
              href="#Smartphones"
            >
              Smartphones
            </a>
          </li>
          <li class="menu_item">
            <a
              class="menu_link"
              href="#Laptops"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="menu_item">
            <a
              class="menu_link"
              href="#Gadgets"
            >
              Gadgets
            </a>
          </li>
          <li class="menu_item">
            <a
              class="menu_link"
              href="#Tablets"
            >
              Tablets
            </a>
          </li>
          <li class="menu_item">
            <a
              class="menu_link"
              href="#Photo"
            >
              Photo
            </a>
          </li>
          <li class="menu_item">
            <a
              class="menu_link"
              href="#Video"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <h1>Moyo header</h1>
  </body>
</html>
