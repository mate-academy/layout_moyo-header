<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <body>
    <header>
      <div class="header__content">
        <a
          class="logo__link"
          href="index.html"
        >
          <img
            src="./images/logo.png"
            alt="Moyo logo"
          />
        </a>
        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a
                href="#apple"
                class="is-active nav__link"
              >
                apple
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#samsung"
              >
                samsung
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#smartphones"
              >
                smartphones
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#laptops-computers"
                data-qa="hover"
              >
                laptops & computers
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#gadgets"
              >
                gadgets
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#tablets"
              >
                tablets
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#photo"
              >
                photo
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#video"
              >
                video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
