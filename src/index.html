<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <body>
    <header class="header">
      <a
        href="#"
        class="logo"
      >
        <img
          src="images/logo.png"
          alt="MOYO Logo"
        />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__list-item">
            <a
              href="#"
              class="nav__item is-active"
            >
              Apple
            </a>
          </li>
          <li class="nav__list-item">
            <a
              href="#"
              class="nav__item"
            >
              Samsung
            </a>
          </li>
          <li class="nav__list-item">
            <a
              href="#"
              class="nav__item"
            >
              Smartphones
            </a>
          </li>
          <li class="nav__list-item">
            <a
              href="#"
              class="nav__item"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav__list-item">
            <a
              href="#"
              class="nav__item"
            >
              Gadgets
            </a>
          </li>
          <li class="nav__list-item">
            <a
              href="#"
              class="nav__item"
            >
              Tablets
            </a>
          </li>
          <li class="nav__list-item">
            <a
              href="#"
              class="nav__item"
            >
              Photo
            </a>
          </li>
          <li class="nav__list-item">
            <a
              href="#"
              class="nav__item"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
