<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="index.html"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="Company Name"
        />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <a
            href="./index.html"
            class="nav__link is-active"
          >
            <li>apple</li>
          </a>
          <a
            href="./index.html"
            class="nav__link"
          >
            <li>samsung</li>
          </a>
          <a
            href="./index.html"
            class="nav__link"
          >
            <li>smartphones</li>
          </a>
          <a
            href="./index.html"
            class="nav__link"
            data-qa="hover"
          >
            <li>laptops & computers</li>
          </a>
          <a
            href="./index.html"
            class="nav__link"
          >
            <li>gadgets</li>
          </a>
          <a
            href="./index.html"
            class="nav__link"
          >
            <li>tablets</li>
          </a>
          <a
            href="./index.html"
            class="nav__link"
          >
            <li>photo</li>
          </a>
          <a
            href="./index.html"
            class="nav__link"
          >
            <li>video</li>
          </a>
        </ul>
      </nav>
    </header>
  </body>
</html>
