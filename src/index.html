<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Roboto: ONLY roman (normal), weight 500 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./styles.css"
    />
    <title>Header</title>
  </head>

  <body>
    <header class="header">
      <!-- Logo is a link with an image inside, NOT part of <nav> -->
      <a
        class="header__logo"
        href="#"
      >
        <img
          class="header__logo-img"
          src="src/images/logo.png"
          alt="Logo"
        />
      </a>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              class="nav__link is-active"
              href="#"
            >
              Phones
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="#"
            >
              Tablets
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="#"
            >
              Accessories
            </a>
          </li>

          <li class="nav__item">
            <a
              class="nav__link"
              href="#"
              data-qa="hover"
            >
              Laptops &amp; computers
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
