<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="logoContainer">
        <a
          href="#"
          class="logotyp"
        >
          <img
            src="./images/logo.png"
            alt="moyo"
          />
        </a>
      </div>
      <nav class="nav">
        <ul class="linksList">
          <li class="links">
            <a
              href="#"
                class="is-active"
            >
              Apple
            </a>
          </li>
          <li class="links">
            <a
              href="#"
                class="linksHref"
            >
              Samsung
            </a>
          </li>
          <li class="links">
            <a
            href="#"
              class="linksHref"
              >
              Smartphones
            </a>
          </li>
          <li class="links">
            <a
              href="#"
                data-qa="hover"
            class="linksHref">Laptops & Computers</a>
          </li>
          <li class="links">
            <a
              href="#"
                class="linksHref">
               Gadgets
            </a>
          </li>
          <li class="links">
            <a
              href="#"
                class="linksHref">
              Tablets
            </a>
          </li>
          <li class="links">
            <a
              href="#"
                class="linksHref">
              Photo
            </a>
          </li>
          <li class="links">
            <a
              href="#"
                class="linksHref">
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
