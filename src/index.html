<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="main-header">
      <a
        href="http://moyo.com"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="Moyo Logo"
          class="logo-image"
        />
      </a>

      <nav class="main-nav">
        <ul class="nav-list">
          <li class="list__link">
            <a
              class="link is-active"
              href="http://moyo.com/apple"
            >
              Apple
            </a>
          </li>
          <li class="list__link">
            <a
              class="link"
              href="http://moyo.com/samsung"
            >
              Samsung
            </a>
          </li>
          <li class="list__link">
            <a
              class="link"
              href="http://moyo.com/smartphones"
            >
              Smartphones
            </a>
          </li>
          <li class="list__link">
            <a
              class="link"
              href="http://moyo.com/laptops-computers"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="list__link">
            <a
              class="link"
              href="http://moyo.com/gadgets"
            >
              Gadgets
            </a>
          </li>
          <li class="list__link">
            <a
              class="link"
              href="http://moyo.com/tablets"
            >
              Tablets
            </a>
          </li>
          <li class="list__link">
            <a
              class="link"
              href="http://moyo.com/photo"
            >
              Photo
            </a>
          </li>
          <li class="list__link">
            <a
              class="link"
              href="http://moyo.com/video"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
