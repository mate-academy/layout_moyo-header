<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />

    <title>Moyo header</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,100,500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="/home"
        title="logo-link"
        class="logo-link"
      >
        <img
          src="images/moyo-logo.png"
          class="moyo-logo"
          alt="moyo-logo"
          width="40px"
          height="40px"
        />
      </a>

      <nav>
        <ul>
          <li>
            <a class="nav-link is-active">Apple</a>
          </li>

          <li>
            <a class="nav-link">Samsung</a>
          </li>

          <li>
            <a class="nav-link">Smartphones</a>
          </li>

          <li>
            <a
              class="nav-link"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>

          <li>
            <a class="nav-link">Gadgets</a>
          </li>

          <li>
            <a class="nav-link">Tablets</a>
          </li>

          <li>
            <a class="nav-link">Photo</a>
          </li>

          <li>
            <a class="nav-link">Video</a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>

<!-- use semantic tags: <header>, <img>, <nav>, <ul>, <li> and <a></a> -->
