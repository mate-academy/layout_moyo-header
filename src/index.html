<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <img
        class="logo-img"
        src="images/logo.png"
        alt="logo"
      />
      <nav>
        <ul class="item-conteiner">
          <a class="item is-active">Apple</a>
          <li class="item">Samsung</li>
          <li class="item">Smartphones</li>
          <li
            class="item"
            data-qa="hover"
          >
            Laptops & Computers
          </li>
          <li class="item">Gadgets</li>
          <li class="item">Tablets</li>
          <li class="item">Photo</li>
          <li class="item">Video</li>
        </ul>
      </nav>
    </header>
  </body>
</html>
