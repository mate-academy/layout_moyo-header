<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <div class="divs">
        <a
          href="#"
          class="logo"
        >
          <img
            src="images/logo.png"
            alt="logo"
          />
        </a>

        <nav>
          <ul>
            <div class="div">
              <li>
                <a
                  class="is-active"
                  href="#"
                >
                  Apple
                </a>
              </li>
            </div>
            <li>
              <a
                href="#"
                class="blue"
              >
                Samsung
              </a>
            </li>
            <li>
              <a
                href="#"
                class="blue"
              >
                Smartphones
              </a>
            </li>
            <li>
              <a
                data-qa="hover"
                href="#"
              >
                Laptops & Computers
              </a>
            </li>
            <li>
              <a
                href="#"
                class="blue"
              >
                Gadgets
              </a>
            </li>
            <li>
              <a
                href="#"
                class="blue"
              >
                Tablets
              </a>
            </li>
            <li>
              <a
                href="#"
                class="blue"
              >
                Photo
              </a>
            </li>
            <li>
              <a
                href="#"
                class="blue"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
