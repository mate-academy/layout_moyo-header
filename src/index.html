<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width,
      user-scalable=no,
      initial-scale=1.0,
      maximum-scale=1.0,
      minimum-scale=1.0"
    />

    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />

    <title>Moyo header</title>

    <link
      rel="stylesheet"
      href="./style.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <header class="header">
      <a
        href="#"
        class="logo"
      >
        <img
          src="images/logo.png"
          alt="MOYO company logo"
        />

      </a>

      <nav class="_nav">
        <ul class="list">
          <li>
            <a
              href="#"
              class="is-active link"
            >
              apple
            </a>

          </li>

          <li>
            <a
              href="#"
              class="link"
            >
              samsung
            </a>

          </li>

          <li>
            <a
              href="#"
              class="link"
            >
              smartphones
            </a>

          </li>

          <li>
            <a
              href="#"
              class="link"
              data-qa="hover"
            >
              laptops & computers
            </a>

          </li>

          <li>
            <a
              href="#"
              class="link"
            >
              gadgets
            </a>

          </li>

          <li>
            <a
              href="#"
              class="link"
            >
              tablets
            </a>
          </li>

          <li>
            <a
              href="#"
              class="link"
            >
              photo
            </a>
          </li>

          <li>
            <a
              href="#"
              class="link"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
