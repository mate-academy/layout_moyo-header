<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,
               user-scalable=no,
               initial-scale=1.0,
               maximum-scale=1.0,
               minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=block"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        class="logo"
        href="#"
      >
        <img
          class="logo_img"
          src="./images/logo.png"
          alt="MOYO logo"
        />
      </a>

      <nav class="nav">
        <ul class="nav_list">
          <li>
            <a
              class="nav_link is-active"
              href="#apple"
            >
              apple
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#samsung"
            >
              samsung
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#smartphone"
            >
              smartphone
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#laptops&computers"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#gadgets"
            >
              gadgets
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#tablets"
            >
              tablets
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#photo"
            >
              photo
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#video"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
