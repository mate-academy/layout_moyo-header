<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <h1>Moyo header</h1>
    <header>
      <a
        class="logo"
        href="/"
      >
        <img
          class="logo-image"
          src="images/logo.png"
          alt="Moyo logo"
        />
      </a>

      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li>
            <a
              class="nav-link is-active"
              href="#"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              class="nav-link"
              href="#"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              class="nav-link"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              class="nav-link"
              data-qa="hover"
              href="#"
            >
              Laptops & Computers
            </a>
          </li>
          <li>
            <a
              class="nav-link"
              href="#"
            >
              Gadgets
            </a>
          </li>
          <li>
            <a
              class="nav-link"
              href="#"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              class="nav-link"
              href="#"
            >
              Photo
            </a>
          </li>
          <li>
            <a
              class="nav-link"
              href="#"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
