<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <div>
        <a
          class="image"
          href="#"
        >
          <img
            src="/src/images/logo.png"
            alt="img"
          />
        </a>
      </div>
      <nav class="container">
        <ul class="list">
          <li>
            <a
              class="item item-1 is-active"
              href="#"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              class="item item-2"
              href="#"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              class="item item-3"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              class="item item-4"
              href="#"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>

          <li>
            <a
              class="item item-5"
              href="#"
            >
              Gadgets
            </a>
          </li>
          <li>
            <a
              class="item item-6"
              href="#"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              class="item item-7"
              href="#"
            >
              Photo
            </a>
          </li>
          <li>
            <a
              class="item item-8"
              href="#"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
