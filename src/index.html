<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="index.html"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="MOYO logo"
          class="logo_png"
        />
      </a>
      <nav class="nav">
        <ul class="nav_list">
          <li class="nav_items">
            <a
              class="is-active nav_link_apple nav_links"
              href="apple"
            >
              Apple
            </a>
          </li>
          <li class="nav_items">
            <a
              class="nav_link_samsung nav_links"
              href="apple"
            >
              Samsung
            </a>
          </li>
          <li class="nav_items">
            <a
              class="nav_link_smartphones nav_links"
              href="apple"
            >
              Smartphones
            </a>
          </li>
          <li class="nav_items">
            <a
              class="nav_link_laptopscomputers nav_links"
              data-qa="hover"
              href="apple"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav_items">
            <a
              class="nav_link_gadgets nav_links"
              href="apple"
            >
              Gadgets
            </a>
          </li>
          <li class="nav_items">
            <a
              class="nav_link_tablets nav_links"
              href="apple"
            >
              Tablets
            </a>
          </li>
          <li class="nav_items">
            <a
              class="nav_link_photo nav_links"
              href="apple"
            >
              Photo
            </a>
          </li>
          <li class="nav_items">
            <a
              class="nav_link_video nav_links"
              href="apple"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
