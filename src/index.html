<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"

    />
  </head>
  <body>
    <header>
      <a
        href="#"
        class="header__logo"
      >
        <img
          src="https://raw.githubusercontent.com/mate-academy/layout_moyo-header/master/src/images/logo.png"
          alt="MOYO logo"
        />
      </a>

      <nav>
        <ul>
          <li>
            <a
              href="#apple"
              class="nav__link is-active"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              href="#samsung"
              class="nav__link"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              href="#smartphones"
              class="nav__link"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              href="#laptops"
              class="nav__link"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>
          <li>
            <a
              href="#gadgets"
              class="nav__link"
            >
              Gadgets
            </a>
          </li>
          <li>
            <a
              href="#tablets"
              class="nav__link"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              href="#photo"
              class="nav__link"
            >
              Photo
            </a>
          </li>
          <li>
            <a
              href="#video"
              class="nav__link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
