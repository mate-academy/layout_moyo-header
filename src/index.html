<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header">
      <a
        href="#home"
        class="header__link"
      >
        <img
          src="/src/images/logo.png"
          alt="MOYO image logo"
          class="header__img"
        />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              id="apple"
              class="nav__link is-active"
              href="#apple"
            >
              apple
            </a>
          </li>

          <li class="nav__item">
            <a
              id="samsung"
              class="nav__link"
              href="#samsung"
            >
              samsung
            </a>
          </li>

          <li class="nav__item">
            <a
              id="smartphone"
              class="nav__link"
              href="#smartphone"
            >
              smartphones
            </a>
          </li>

          <li class="nav__item">
            <a
              id="laptop-computer"
              class="nav__link"
              data-qa="hover"
              href="#laptop-computer"
            >
              laptops & computers
            </a>
          </li>

          <li class="nav__item">
            <a
              id="gadgets"
              class="nav__link"
              href="#gadgets"
            >
              gadgets
            </a>
          </li>

          <li class="nav__item">
            <a
              id="tablets"
              class="nav__link"
              href="#tablets"
            >
              tablets
            </a>
          </li>

          <li class="nav__item">
            <a
              id="photo"
              class="nav__link"
              href="#photo"
            >
              photo
            </a>
          </li>

          <li class="nav__item">
            <a
              id="video"
              class="nav__link"
              href="#video"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
