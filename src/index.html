<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header_logo">
        <a
          class="header_logo_link"
          href="#"
        >
          <img
            src="./images/logo.png"
            alt="Moyo logo"
          />
        </a>
      </div>
      <nav class="header_nav">
        <ul class="header_nav_contain">
          <li class="header_nav_list">
            <a
              class="header_nav_list_link is-active"
              href="#"
            >
              Apple
            </a>
          </li>
          <li class="header_nav_list">
            <a
              class="header_nav_list_link lint_indent"
              href="#"
            >
              Samsung
            </a>
          </li>
          <li class="header_nav_list">
            <a
              class="header_nav_list_link lint_indent"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li class="header_nav_list">
            <a
              class="header_nav_list_link lint_indent"
              href="#"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>
          <li class="header_nav_list">
            <a
              class="header_nav_list_link lint_indent"
              href="#"
            >
              Gadgets
            </a>
          </li>
          <li class="header_nav_list">
            <a
              class="header_nav_list_link lint_indent"
              href="#"
            >
              Tablets
            </a>
          </li>
          <li class="header_nav_list">
            <a
              class="header_nav_list_link lint_indent"
              href="#"
            >
              Photo
            </a>
          </li>
          <li class="header_nav_list">
            <a
              class="header_nav_list_link"
              href="#"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
