<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Moyo header</title>

    <link rel="stylesheet" href="./style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header">
      <a href="/" class="logo">
        <img
          class="logo__img"
          src="./images/logo.png"
          alt="MOYO logo"
        />
      </a>

      <nav class="nav" aria-label="Main navigation">
        <ul class="menu">
          <li class="menu__item">
            <a href="#" class="menu__link is-active">Apple</a>
          </li>

          <li class="menu__item">
            <a href="#" class="menu__link">Samsung</a>
          </li>

          <li class="menu__item">
            <a href="#" class="menu__link">Smartphones</a>
          </li>

          <li class="menu__item">
            <a
              href="#"
              class="menu__link"
              data-qa="hover"
            >
              Laptops &amp; computers
            </a>
          </li>

          <li class="menu__item">
            <a href="#" class="menu__link">Gadgets</a>
          </li>

          <li class="menu__item">
            <a href="#" class="menu__link">Tablets</a>
          </li>

          <li class="menu__item">
            <a href="#" class="menu__link">Photo</a>
          </li>

          <li class="menu__item">
            <a href="#" class="menu__link">Video</a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
