<!-- #region Meta -->
<!doctype html>
<html
  class="html"
  lang="en"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,
      user-scalable=no,
      initial-scale=1.0,
      maximum-scale=1.0,
      minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <!-- #endregion Meta -->
  <body class="page">
    <header class="header">
      <a
        href="#header"
        class="header__link-image"
      >
        <img
          class="logo"
          src="./images/logo.png"
          alt="logo moyo"
        />
      </a>

      <nav>
        <ul class="menu">
          <li class="menu__iten">
            <a
              href="#apple"
              class="menu__link is-active"
            >
              apple
            </a>
          </li>

          <li class="menu__iten">
            <a
              class="menu__link"
              href="#samsung"
            >
              samsung
            </a>
          </li>

          <li class="menu__iten">
            <a
              class="menu__link"
              href="#smartphones"
            >
              smartphones
            </a>
          </li>

          <li class="menu__iten">
            <a
              href="#laptops&computers"
              class="menu__link"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>

          <li class="menu__iten">
            <a
              class="menu__link"
              href="#gadgets"
            >
              gadgets
            </a>
          </li>

          <li class="menu__iten">
            <a
              class="menu__link"
              href="#tablets"
            >
              tablets
            </a>
          </li>

          <li class="menu__iten">
            <a
              class="menu__link"
              href="#photo"
            >
              photo
            </a>
          </li>

          <li class="menu__iten">
            <a
              class="menu__link"
              href="#video"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
