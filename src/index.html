<!doctype html>
<html lang="en">
  <head>

      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"

    <title>Moyo header</title>
    <link

      href="./style.css"
    />
    <link
      rel="preconnect"

      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"

          <li class="nav_item">
            <a

              href="https://www.moyo.ua/telecommunication/smart/samsung/"

          <li class="nav_item">
            <a
              class="nav_link"

          <li class="nav_item">

              class="nav_link"
              href="https://www.moyo.ua/portal_brand/comp_and_periphery/"

            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="https://www.moyo.ua/foto_video/photo_video/cameras/"

              PHOTO

            <a
