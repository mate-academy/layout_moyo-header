<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__content">
        <div class="header__logo">
          <a href="#">
            <img
              src="images/logo.png"
              alt="Moyo"
              class="header__logo_image"
            />
          </a>
        </div>
        <nav class="header__menu">
          <ul class="header__menu_list">
            <li class="header__menu_item">
              <a
                href="#"
                class="is-active"
              >
                Apple
              </a>
            </li>
            <li class="header__menu_item">
              <a href="#">Samsung</a>
            </li>
            <li class="header__menu_item">
              <a href="#">Smartphones</a>
            </li>
            <li class="header__menu_item">
              <a
                href="#"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li class="header__menu_item">
              <a href="#">Gadgets</a>
            </li>
            <li class="header__menu_item">
              <a href="#">Tablets</a>
            </li>
            <li class="header__menu_item">
              <a href="#">Photo</a>
            </li>
            <li class="header__menu_item">
              <a href="#">Video</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
