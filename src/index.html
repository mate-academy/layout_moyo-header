<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <a
        class="logo-link"
        href="#"
      >
        <img
          class="logo"
          src="images/logo.svg"
          alt="logo"
        />
      </a>
      <nav>
        <li>
          <a
            href="#"
            class="nav_link is-active"
          >
            APPLE
          </a>
        </li>
        <li>
          <a
            href="#"
            class="nav_link"
          >
            SAMSUNG
          </a>
        </li>
        <li>
          <a
            href="#"
            class="nav_link"
          >
            SMARTPHONES
          </a>
        </li>
        <li>
          <a
            href="#"
            class="nav_link computers"
            data-qa="hover"
          >
            LAPTOPS & COMPUTERS
          </a>
        </li>
        <li>
          <a
            href="#"
            class="nav_link"
          >
            GADGETS
          </a>
        </li>
        <li>
          <a
            href="#"
            class="nav_link"
          >
            TABLETS
          </a>
        </li>
        <li>
          <a
            href="#"
            class="nav_link"
          >
            PHOTO
          </a>
        </li>
        <li>
          <a
            href="#"
            class="nav_link"
          >
            VIDEO
          </a>
        </li>
      </nav>
    </header>
  </body>
</html>
