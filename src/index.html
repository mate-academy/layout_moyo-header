<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        class="header__logo"
        href="#"
      >
        <img
          src="./images/logo.png"
          alt="Logo"
        />
      </a>
      <nav class="header__menu">
        <ul class="header__list">
          <li class="header__link">
            <a
              class="is-active"
              href="#"
            >
              <span>Apple</span>
            </a>
          </li>
          <li class="header__link">
            <a href="#"><span>Samsung</span></a>
          </li>
          <li class="header__link">
            <a href="#"><span>Smartphones</span></a>
          </li>
          <li class="header__link">
            <a
              href="#"
              data-qa="hover"
            >
              <span>laptops & computers</span>
            </a>
          </li>
          <li class="header__link">
            <a href="#"><span>gadgets</span></a>
          </li>
          <li class="header__link">
            <a href="#"><span>tablets</span></a>
          </li>
          <li class="header__link">
            <a href="#"><span>photo</span></a>
          </li>
          <li class="header__link">
            <a href="#"><span>video</span></a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
