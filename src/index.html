<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo Header</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="moyo-header">
      <a
        href="#"
        class="moyo-header__logo"
      >
        <img
          src="images/logo.png"
          alt="Moyo Logo"
        />
      </a>

      <nav class="moyo-header__nav">
        <ul>
          <li>
            <a
              href="#"
              class="is-active"
            >
              Apple
            </a>
          </li>
          <li><a href="#">Samsung</a></li>
          <li><a href="#">Smartphones</a></li>
          <li>
            <a
              href="#"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>
          <li><a href="#">Gadgets</a></li>
          <li><a href="#">Tablets</a></li>
          <li><a href="#">Photo</a></li>
          <li><a href="#">Video</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>
