<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <title>Moyo header</title>
  </head>

      <a

        class="logo"
      >

      <nav class="navigation">
        <ul class="nav_list">
          <li class="element">
            <a
              href="1"
              class="nav_link is-active"
            >

            </a>
          </li>
          <li class="element">
            <a
              href="2"
              class="nav_link"
            >
              samsung
            </a>
          </li>
          <li class="element">
            <a
              href="3"
              class="nav_link"
            >
              smartphones
            </a>
          </li>
          <li class="element">
            <a
              href="4"
              class="nav_link"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>
          <li class="element">
            <a
              href="5"
              class="nav_link"
            >
              gadgets
            </a>
          </li>
          <li class="element">
            <a
              href="6"
              class="nav_link"
            >
              tablets
            </a>
          </li>
          <li class="element">
            <a
              href="7"
              class="nav_link"
            >
              photo
            </a>
          </li>
          <li class="element">
            <a
              href="8"
              class="nav_link"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>

</html>
