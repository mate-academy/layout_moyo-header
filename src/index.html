<!doctype html>
<html lang="en">

      user-scalable=no,

      maximum-scale=1.0,
      minimum-scale=1.0"

    <meta

    <title>Moyo header</title>
    <link

    />

      rel="preconnect"

    />

            <li class="menu-item">
              <a
                href="#"
                class="menu-link"

            <li class="menu-item">
              <a
                href="#"
                class="menu-link"
              >
                Smartphones
              </a>
            </li>
            <li class="menu-item">
              <a
                href="#"

            </li>
            <li class="menu-item">
              <a
                href="#"
                class="menu-link"

              </a>
            </li>
            <li class="menu-item">
              <a
                href="#"
                class="menu-link"
              >
                Tablets
              </a>
            </li>
            <li class="menu-item">
              <a
                href="#"
                class="menu-link"
              >
                Photo
              </a>
            </li>
            <li class="menu-item">
              <a
                href="#"
                class="menu-link"

              </a>

          </ul>
