<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a href="#">
          <img
            src="images/logo.png"
            alt="MOYO logo"
            class="logo"
          />
        </a>
        <nav class="nav">
          <ul class="nav_list">
            <li class="nav_item">
              <a
                class="nav_link is-active"
                href="#"
              >
                apple
              </a>
            </li>
            <li class="nav_item">
              <a
                class="nav_link"
                href="#"
              >
                samsung
              </a>
            </li>
            <li class="nav_item">
              <a
                class="nav_link"
                href="#"
              >
                smartphones
              </a>
            </li>
            <li class="nav_item">
              <a
                class="nav_link"
                href="#"
                data-qa="hover"
              >
                laptops & computers
              </a>
            </li>
            <li class="nav_item">
              <a
                class="nav_link"
                href="#"
              >
                gadgets
              </a>
            </li>
            <li class="nav_item">
              <a
                class="nav_link"
                href="#"
              >
                tablets
              </a>
            </li>
            <li class="nav_item">
              <a
                class="nav_link"
                href="#"
              >
                photo
              </a>
            </li>
            <li class="nav_item">
              <a
                class="nav_link"
                href="#"
              >
                video
              </a>
            </li>
          </ul>
        </nav>
      </header>
    </div>
  </body>
</html>
