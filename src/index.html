<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a
          class="logo"
          href="#"
        >
          <img
            src="./images/logo.png"
            alt="logo"
          />
        </a>
        <ul class="header__li">
          <li class="header__items is-active">
            <a href="#">APPLE</a>
          </li>
          <li class="header__items">
            <a href="#">SAMSUNG</a>
          </li>
          <li class="header__items">
            <a href="#">SMARTPHONES</a>
          </li>
          <li class="header__items">
            <a
              data-qa="hover"
              href="#"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>
          <li class="header__items">
            <a href="#">GADGETS</a>
          </li>
          <li class="header__items">
            <a href="#">TABLES</a>
          </li>
          <li class="header__items">
            <a href="#">PHOTO</a>
          </li>
          <li class="header__items">
            <a href="#">VIDEO</a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
