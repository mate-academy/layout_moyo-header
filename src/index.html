<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        class="logo"
        href="#"
      >
        <img
          class="logo__image"
          src="./images/logo.png"
          alt="Moyo Logo"
        />
      </a>
      <nav class="main-nav">
        <ul class="main-nav__list">
          <li class="main-nav__item">
            <a
              href="#Apple"
              class="main-nav__link is-active"
            >
              Apple
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="#Samsung"
              class="main-nav__link"
            >
              Samsung
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="#Smartphones"
              class="main-nav__link"
            >
              Smartphones
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="#Laptops&Computers"
              data-qa="hover"
              class="main-nav__link"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="#Gadgets"
              class="main-nav__link"
            >
              Gadgets
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="#Tablets"
              class="main-nav__link"
            >
              Tablets
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="#Photo"
              class="main-nav__link"
            >
              Photo
            </a>
          </li>
          <li class="main-nav__item">
            <a
              href="#Video"
              class="main-nav__link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
