<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="color-scheme"
      content="light"
    />

    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <!-- Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a href="#logo">
        <img
          class="logo"
          src="./images/logo.png"
          alt="Logo square moyo black and blue"
        />
      </a>

      <nav>
        <ul class="links">
          <li><a href="#apple">apple</a></li>
          <li><a href="#samsung">samsung</a></li>
          <li>
            <a
              href="#laptops"
              class="header_link is-active"
            >
              lap tops & computers
            </a>
          </li>
          <li><a href="#gadgets">gadgets</a></li>
          <li><a href="#photo">photo</a></li>
          <li><a href="#video">video</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>
