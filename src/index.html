<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="#"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="MOYO logo"
          class="logo-img"
        />
      </a>
      <nav class="nav">
        <ul class="header-list">
          <li>
            <a
              href="#"
              class="link is-active"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              href="#"
              class="link"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              href="#"
              class="link"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              href="#"
              data-qa="hover"
              class="link hover-link"
            >
              Laptops & Computers
            </a>
          </li>
          <li>
            <a
              href="#"
              class="link"
            >
              Gadgets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="link"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="link"
            >
              Photo
            </a>
          </li>
          <li>
            <a
              href="#"
              class="link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
