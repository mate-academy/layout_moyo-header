<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>

    <!-- Roboto font: roman, medium (500) only -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="site-header">
      <a
        class="header-a"
        href="#"
      >
        <img
          class="logo"
          src="./images/logo.png"
          alt="Company Name Logo"
        />
      </a>
      <nav class="nav-bar">
        <ul class="category-list">
          <li class="list-item">
            <a
              href="#"
              class="is-active"
            >
              Apple
            </a>
          </li>
          <li class="list-item"><a href="#">Samsung</a></li>
          <li class="list-item"><a href="#">Smartphones</a></li>
          <li
            class="list-item"
            data-qa="hover"
          >
            <a href="#">Laptops & Computers</a>
          </li>
          <li class="list-item"><a href="#">Gadgets</a></li>
          <li class="list-item"><a href="#">Tablets</a></li>
          <li class="list-item"><a href="#">Photo</a></li>
          <li class="list-item"><a href="#">Video</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>
