<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="/home"
        class="logo__a"
      >
        <img
          src="/src/images/logo.png"
          alt="Moyo company logo"
          class="logo__img"
        />
      </a>
      <nav class="navigation__header">
        <ul class="nav__ul">
          <li class="nav__li">
            <a
              href="/catalog"
              class="nav__a is-active"
            >
              Apple
            </a>
          </li>
          <li class="nav__li">
            <a
              href="/catalog"
              class="nav__a"
            >
              Samsung
            </a>
          </li>
          <li class="nav__li">
            <a
              href="/catalog"
              class="nav__a"
            >
              Smartphones
            </a>
          </li>
          <li class="nav__li">
            <a
              href="/catalog"
              data-qa="hover"
              class="nav__a"
            >
              Laptops & computers
            </a>
          </li>
          <li class="nav__li">
            <a
              href="/catalog"
              class="nav__a"
            >
              Gadgets
            </a>
          </li>
          <li class="nav__li">
            <a
              href="/catalog"
              class="nav__a"
            >
              Tablets
            </a>
          </li>
          <li class="nav__li">
            <a
              href="/catalog"
              class="nav__a"
            >
              Photo
            </a>
          </li>
          <li class="nav__li">
            <a
              href="/catalog"
              class="nav__a"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
