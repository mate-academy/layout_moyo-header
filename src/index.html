<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a>
        <img
          src="images/logo.png"
          alt="logo"
          class="logo"
        />
      </a>
      <nav>
        <ul class="list">
          <li>
            <a class="is-active apple list-link">Apple</a>
          </li>
          <li>
            <a class="list-link">Samsung</a>
          </li>
          <li>
            <a class="'list-link">Smartphones</a>
          </li>

          <li>
            <a
              data-qa="hover"
              class="list-link"
            >
              Laptops & Computers
            </a>
          </li>
          <li>
            <a class="'list-link">Gadgets</a>
          </li>
          <li>
            <a class="'list-link">Tablets</a>
          </li>
          <li>
            <a class="list-link">Photo</a>
          </li>
          <li class="video">
            <a class="list-link">Video</a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
