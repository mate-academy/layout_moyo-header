<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <a href="#">
          <img
            class="logo__img"
            src="images/logo.png"
            alt="Moyo logo"
          />
        </a>
      </div>
      <nav class="nav">
        <ul class="nav__links">
          <li class="nav__item">
            <a
              class="link is-active"
              href="#"
            >
              apple
            </a>
          </li>
          <li class="nav__item">
            <a
              class="link"
              href="#"
            >
              samsung
            </a>
          </li>
          <li class="nav__item">
            <a
              class="link"
              href="#"
            >
              smartphones
            </a>
          </li>
          <li class="nav__item">
            <a
              class="link"
              data-qa="hover"
              href="#"
            >
              laptops & computers
            </a>
          </li>
          <li class="nav__item">
            <a
              class="link"
              href="#"
            >
              gadgets
            </a>
          </li>
          <li class="nav__item">
            <a
              class="link"
              href="#"
            >
              tablets
            </a>
          </li>
          <li class="nav__item">
            <a
              class="link"
              href="#"
            >
              photo
            </a>
          </li>
          <li class="nav__item">
            <a
              class="link"
              href="#"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
