<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="#"
        class="logo"
      >
        <img
          src="images/logo.png"
          alt="MOYO logo"
        />
      </a>
      <nav class="nav">
        <ul class="nav_ul">
          <li class="nav_li">
            <a
              href="#apple"
              class="nav_li is-active"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              href="#Samsung"
              class="nav_li"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              href="#Smartphones"
              class="nav_li"
            >
              smartphones
            </a>
          </li>
          <li>
            <a
              href="#laptops"
              class="nav_li"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li>
            <a
              href="#gadgets"
              class="nav_li"
            >
              Gadgets
            </a>
          </li>
          <li>
            <a
              href="#tablets"
              class="nav_li"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              href="#photo"
              class="nav_li"
            >
              Photo
            </a>
          </li>
          <li>
            <a
              href="#video"
              class="nav_li"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
