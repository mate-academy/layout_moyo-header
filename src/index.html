<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        class="header__logo"
        href="#"
      >
        <img
          src="https://github.com/artembaranovsky1/layout_moyo-header/blob/master/src/images/logo.png?raw=true"
          alt="logo moyo"
        />
      </a>
      <nav
        class="navigation"
        id="nav"
      >
        <ul class="navigation__list">
          <li class="navigation__item">
            <a
              class="navigation__link is-active"
              href="#"
            >
              Apple
            </a>
          </li>
          <li class="navigation__item">
            <a
              class="navigation__link"
              href="#"
            >
              Samsung
            </a>
          </li>
          <li class="navigation__item">
            <a
              class="navigation__link"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li class="navigation__item">
            <a
              class="navigation__link"
              href="#"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="navigation__item">
            <a
              class="navigation__link"
              href="#"
            >
              Gadgets
            </a>
          </li>
          <li class="navigation__item">
            <a
              class="navigation__link"
              href="#"
            >
              Tablets
            </a>
          </li>
          <li class="navigation__item">
            <a
              class="navigation__link"
              href="#"
            >
              Photo
            </a>
          </li>
          <li class="navigation__item">
            <a
              class="navigation__link"
              href="#"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
