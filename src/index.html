<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
    />
    <link
      rel="stylesheet"
      href="./reset.css"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <body>
    <header class="header">
      <div>
        <a href="#">
          <img
            src="./images/logo.png"
            alt="Moyo logo"
            width="40"
            height="40"
          />
        </a>
      </div>
      <nav>
        <ul class="header__list">
          <li class="header__list-item">
            <a
              class="header__list-item-link is-active"
              href="#"
            >
              Apple
            </a>
          </li>
          <li class="header__list-item">
            <a
              class="header__list-item-link"
              href="#"
            >
              Samsung
            </a>
          </li>
          <li class="header__list-item">
            <a
              class="header__list-item-link"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li class="header__list-item">
            <a
              class="header__list-item-link"
              href="#"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="header__list-item">
            <a
              class="header__list-item-link"
              href="#"
            >
              Gadgets
            </a>
          </li>
          <li class="header__list-item">
            <a
              class="header__list-item-link"
              href="#"
            >
              Tablets
            </a>
          </li>
          <li class="header__list-item">
            <a
              class="header__list-item-link"
              href="#"
            >
              Photo
            </a>
          </li>
          <li class="header__list-item">
            <a
              class="header__list-item-link"
              href="#"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
