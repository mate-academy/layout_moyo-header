<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo Header</title>

    <!-- Importing Roboto font with the required specifications -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- Linking external CSS file -->
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <div class="header-container">
        <!-- Logo should be a link wrapping an image -->
        <a
          href="#"
          class="logo"
        >
          <img
            src="./images/logo.png"
            alt="./assets/image.png"
          />
        </a>

        <!-- Navigation menu -->
        <nav>
          <ul>
            <li>
              <a
                href="#"
                class="is-active"
              >
                APPLE
              </a>
            </li>
            <li><a href="#">SAMSUNG</a></li>
            <li><a href="#">SMARTPHONES</a></li>
            <li>
              <a
                href="#"
                data-qa="hover"
              >
                LAPTOPS & COMPUTERS
              </a>
            </li>
            <li><a href="#">GADGETS</a></li>
            <li><a href="#">TABLETS</a></li>
            <li><a href="#">PHOTO</a></li>
            <li><a href="#">VIDEO</a></li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
