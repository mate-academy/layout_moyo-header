<!doctype html>
<html lang="en">
  <head>
    <title>Moyo Header</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <a
        href="/"
        class="site-logo"
      >
        <div class="logo-row">
          <span class="logo-blue">M</span>
          <span class="logo-black">O</span>
        </div>

        <div class="logo-row">
          <span class="logo-black">Y</span>
          <span class="logo-blue">O</span>
        </div>
      </a>

      <nav class="main-nav">
        <ul class="nav-list">
          <li class="nav-item">
            <a
              href="#apple"
              class="is-active"
            >
              APPLE
            </a>
          </li>
          <li class="nav-item">
            <a href="#samsung">SAMSUNG</a>
          </li>

          <li class="nav-item">
            <a href="#smartphones">SMARTPHONES</a>
          </li>

          <li class="nav-item">
            <a
              href="#laptops"
              data-qa="hover"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>

          <li class="nav-item">
            <a href="#gadgets">GADGETS</a>
          </li>

          <li class="nav-item">
            <a href="#tablets">TABLETS</a>
          </li>

          <li class="nav-item">
            <a href="#photo">PHOTO</a>
          </li>

          <li class="nav-item">
            <a href="#video">VIDEO</a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
