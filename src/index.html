<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <a href="#">
        <img
          src="images/logo.png"
          alt="Moyo"
        />
      </a>
      <nav>
        <ul>
          <li class="nav_item">
            <a
              href="#"
              class="nav_link.is-active"
            >
              Apple
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Samsung
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Gadgets
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Tablets
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Photo
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
