<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo Header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="#"
        class="logo-link"
      >
        <img
          src="./images/logo.png"
          alt="Moyo Logo"
          class="logo-img"
        />
      </a>
      <nav class="nav">
        <ul class="nav-list">
          <li class="nav-item">
            <a
              href="#"
              class="nav-link is-active"
            >
              Apple
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Samsung
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Smartphones
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Gadgets
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Tablets
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Photo
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
