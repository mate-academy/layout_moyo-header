<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:wght@500&display=swap"

    />

    <link

      href="./style.css"
    />

  <body>
    <header class="header">
      <a
        class="header-logo"

      >

          class="header-img"
        />
      </a>

      <nav class="nav">
        <ul class="nav-list">
          <li class="nav-item">
            <a
              href="#"
              class="nav-link is-active"
            >
              APPLE
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              SAMSUNG
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              SMARTPHONES
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              data-qa="hover"
              class="nav-link"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              GADGETS
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              TABLETS
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              PHOTO
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              VIDEO
            </a>
          </li>
        </ul>
      </nav>
    </header>

</html>
