<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo Header</title>
    <link
      rel="stylesheet"
      href="styles.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header
      class="header"
      data-qa="header"
    >
      <div class="header__logo">
        <a href="#">
          <img
            src="logo.png"
            alt="Logo"
          />
        </a>
      </div>
      <nav
        class="header__nav"
        data-qa="nav"
      >
        <ul class="nav__list">
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
              data-qa="hover"
            >
              Home
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              About
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link is-active"
              data-qa="active"
            >
              Services
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Contact
            </a>
          </li>
        </ul>
      </nav>
      <div class="header__cart">
        <span class="cart__icon">🛒</span>
        <span>Cart</span>
      </div>
    </header>
  </body>
</html>
