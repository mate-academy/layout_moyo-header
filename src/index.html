<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />

    <!-- Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <title>Moyo Header</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <a
          href="#"
          class="logo"
        >
          <img
            src="images/logo.png"
            alt="Moyo Logo"
          />
        </a>
        <nav class="nav">
          <ul class="nav-list">
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Apple
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Samsung
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Smartphones
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link is-active"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>

            <li>
              <a
                href="#"
                class="nav-link"
              >
                Gadgets
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Tablets
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Photo
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
