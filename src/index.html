<!doctype html>
<html lang="en">
  <head>

    <meta

    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>

    <link
      rel="stylesheet"
      href="./style.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"

        />

            <li class="menu__item">
              <a

                href="#"

            </li>
            <li class="menu__item">
              <a
                class="menu__link"
                href="#"
              >
                SAMSUNG
              </a>
            </li>
            <li class="menu__item">
              <a
                class="menu__link"
                href="#"
              >
                SMARTPHONES
              </a>
            </li>
            <li class="menu__item">
              <a
                class="menu__link is-active"
                href="#"
              >
                LAPTOPS &amp; COMPUTERS
              </a>
            </li>
            <li class="menu__item">
              <a
                class="menu__link"
                href="#"
              >
                GADGETS
              </a>
            </li>
            <li class="menu__item">
              <a
                class="menu__link"
                href="#"
              >
                TABLETS
              </a>
            </li>
            <li class="menu__item">
              <a
                class="menu__link"
                href="#"
              >
                PHOTO
              </a>
            </li>
            <li class="menu__item">
              <a
                class="menu__link"
                href="#"
              >
                VIDEO
              </a>
            </li>
          </ul>
        </nav>
      </div>

</html>
