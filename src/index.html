<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge" />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <header class="header">
      <div class="header__container _container">
        <div class="logo">
          <a
            href="/"
            class="header__logo">
            <img
              src="images/logo.png"
              alt="header logo"
              class="logo__img" />
          </a>
        </div>
        <nav class="header__menu menu">
          <ul class="menu__items">
            <li class="menu__item">
              <a
                href="#"
                class="menu__link is-active"
                data-qa="hover">
                apple
              </a>
            </li>
            <li class="menu__item">
              <a
                href="#"
                class="menu__link">
                samsung
              </a>
            </li>
            <li class="menu__item">
              <a
                href="#"
                class="menu__link">
                smartphones
              </a>
            </li>
            <li class="menu__item">
              <a
                href="#"
                class="menu__link is-active"
                data-qa="hover">
                laptops & computers
              </a>
            </li>
            <li class="menu__item">
              <a
                href="#"
                class="menu__link">
                gadgets
              </a>
            </li>
            <li class="menu__item">
              <a
                href="#"
                class="menu__link">
                tablets
              </a>
            </li>
            <li class="menu__item">
              <a
                href="#"
                class="menu__link">
                photo
              </a>
            </li>
            <li class="menu__item">
              <a
                href="#"
                class="menu__link">
                video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <h1>Moyo header</h1>
  </body>
</html>
