<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <img
          src="./images/logo.png"
          alt="logo"
        />
        <nav class="nav__bar">
          <ul class="nav__bar-ul">
            <li class="nav__bar-list">
              <a
                href="#"
                class="nav__bar-link is-active"
              >
                Apple
              </a>
            </li>
            <li class="nav__bar-list">
              <a
                href="#"
                class="nav__bar-link"
              >
                Samsung
              </a>
            </li>
            <li class="nav__bar-list">
              <a
                href="#"
                class="nav__bar-link"
              >
                Smartphones
              </a>
            </li>
            <li
              data-qa="hover"
              class="nav__bar-list"
            >
              <a
                href="#"
                class="nav__bar-link"
              >
                Laptops & Computers
              </a>
            </li>
            <li class="nav__bar-list">
              <a
                href="#"
                class="nav__bar-link"
              >
                Gadgets
              </a>
            </li>
            <li class="nav__bar-list">
              <a
                href="#"
                class="nav__bar-link"
              >
                Tablets
              </a>
            </li>
            <li class="nav__bar-list">
              <a
                href="#"
                class="nav__bar-link"
              >
                Photo
              </a>
            </li>
            <li class="nav__bar-list">
              <a
                href="#"
                class="nav__bar-link"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </header>
    </div>
  </body>
</html>
