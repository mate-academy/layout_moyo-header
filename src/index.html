<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />

    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />

    <title>Moyo header</title>

    <link
      rel="stylesheet"
      href="./style.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="menu">
      <a
        href="/"
        class="site-logo"
      >
        <img
          src="images/logo.png"
          alt="Moyo Logo"
        />
      </a>

      <nav class="nav-wrapper">
        <ul class="nav__links">
          <li>
            <a
              href="#"
              class="item item-1 is-active"
            >
              Apple
            </a>
          </li>

          <li>
            <a
              href="#"
              class="item item-2"
            >
              Samsung
            </a>
          </li>

          <li>
            <a
              href="#"
              class="item item-3"
            >
              Smartphones
            </a>
          </li>

          <li>
            <a
              href="#"
              class="item item-4"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>

          <li>
            <a
              href="#"
              class="item item-5"
            >
              Gadgets
            </a>
          </li>

          <li>
            <a
              href="#"
              class="item item-6"
            >
              Tablets
            </a>
          </li>

          <li>
            <a
              href="#"
              class="item item-7"
            >
              Photo
            </a>
          </li>

          <li>
            <a
              href="#"
              class="item item-8"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
