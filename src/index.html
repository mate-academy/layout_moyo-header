<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <a
        href="./"
        class="site-header__logo-link"
      >
        <img
          class="site-header__logo-img"
          src="./images/logo.png"
          alt="MOYO logo"
        />
      </a>
      <nav class="site-nav">
        <ul class="site-nav__list">
          <li class="site-nav__item">
            <a
              href="#apple"
              class="site-nav__link is-active"
            >
              Apple
            </a>
          </li>
          <li class="site-nav__item">
            <a
              href="#samsung"
              class="site-nav__link"
            >
              Samsung
            </a>
          </li>
          <li class="site-nav__item">
            <a
              href="#smartphones"
              class="site-nav__link"
            >
              Smartphones
            </a>
          </li>
          <li class="site-nav__item">
            <a
              href="#laptops-computers"
              data-qa="hover"
              class="site-nav__link"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="site-nav__item">
            <a
              href="#gadgets"
              class="site-nav__link"
            >
              Gadgets
            </a>
          </li>
          <li class="site-nav__item">
            <a
              href="#tablets"
              class="site-nav__link"
            >
              Tablets
            </a>
          </li>
          <li class="site-nav__item">
            <a
              href="#photo"
              class="site-nav__link"
            >
              Photo
            </a>
          </li>
          <li class="site-nav__item">
            <a
              href="#video"
              class="site-nav__link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
