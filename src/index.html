<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <body>
    <section class="header-section">
      <header class="header">
        <div class="logo">
          <a
            href="#"
            class="logo-link"
          >
            <img
              src="./images/logo.png"
              alt="moyo"
            />
          </a>
        </div>
        <nav class="nav">
          <ul class="nav-list">
            <li class="nav-item">
              <a
                class="nav-item-link is-active"
                href="#"
              >
                Apple
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-item-link"
                href="#"
              >
                Samsung
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-item-link"
                href="#"
              >
                Smartphones
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-item-link"
                href="#"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-item-link"
                href="#"
              >
                Gadgets
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-item-link"
                href="#"
              >
                Tablets
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-item-link"
                href="#"
              >
                Photo
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-item-link"
                href="#"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </header>
    </section>
  </body>
</html>
