<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />

    <title>Moyo header</title>

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>

      <div class="container">
        <a
          href="/"
          class="logo"
        >

        </a>
        <nav class="nav">
          <ul class="nav__list">
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Apple
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Samsung
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Smartphones
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link is-active"
                data-qa="hover"
              >
                Laptops & Computers
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Gadgets
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Tablets
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link"
              >
                Photos
              </a>
            </li>
            <li>
              <a
                href="#"
                class="nav-link video-margin"
              >
                Videos
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
