<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="*"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body>
    <header>
      <div class="container">
        <a
          href="#"
          class="logo"
        >
          <img
            src="images/logo.png"
            alt="Moyo Logo"
          />
        </a>
        <nav>
          <ul class="nav_list">
            <li class="nav_item">
              <a
                href="#"
                class="is-active nav_link"
              >
                Apple
              </a>
            </li>
            <li class="nav_item nav_not_first">
              <a
                href="#"
                class="nav_link"
              >
                Samsung
              </a>
            </li>
            <li class="nav_item nav_not_first">
              <a
                href="#"
                class="nav_link"
              >
                Smartphones
              </a>
            </li>
            <li class="nav_item nav_not_first">
              <a
                href="#"
                data-qa="hover"
                class="nav_link"
              >
                Laptops & Computers
              </a>
            </li>
            <li class="nav_item nav_not_first">
              <a
                href="#"
                class="nav_link"
              >
                Gadgets
              </a>
            </li>
            <li class="nav_item nav_not_first">
              <a
                href="#"
                class="nav_link"
              >
                Tablets
              </a>
            </li>
            <li class="nav_item nav_not_first">
              <a
                href="#"
                class="nav_link"
              >
                Photo
              </a>
            </li>
            <li class="nav_item nav_not_first">
              <a
                href="#"
                class="nav_link"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
