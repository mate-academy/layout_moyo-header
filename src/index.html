<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="roboto-moyo">
      <div class="logo">
        <a href="#home">
          <img
            src="./images/logo.png"
            alt="Moyo logo"
          />
        </a>
      </div>
      <nav>
        <ul class="nav">
          <li class="nav-item">
            <a
              class="is-active"
              href="#apple"
            >
              apple
            </a>
          </li>
          <li class="nav-item">
            <a href="#samsung">samsung</a>
          </li>
          <li class="nav-item">
            <a href="#smartphones">smartphones</a>
          </li>
          <li class="nav-item">
            <a
              href="#computers"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>
          <li class="nav-item">
            <a href="#gadgets">gadgets</a>
          </li>
          <li class="nav-item">
            <a href="#tablets">tablets</a>
          </li>
          <li class="nav-item">
            <a href="#photo">photo</a>
          </li>
          <li class="nav-item">
            <a href="#video">video</a>
          </li>
        </ul>
      </nav>
    </header>
    <h1>Moyo header</h1>
  </body>
</html>
