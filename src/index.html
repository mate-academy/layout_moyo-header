<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        class="a_logo"
        href="#"
      >
        <img
          class="img_logo"
          src="images/logo.png"
          alt="logo Moyo"
        />
      </a>
      <nav class="navigation">
        <ul class="header_nav">
          <li>
            <a
              class="header_nav_item is-active"
              href="#"
            >
              apple
            </a>
          </li>

          <li>
            <a
              class="header_nav_item"
              href="#"
            >
              samsung
            </a>
          </li>

          <li>
            <a
              class="header_nav_item"
              href="#"
            >
              smartphones
            </a>
          </li>

          <li>
            <a
              class="header_nav_item"
              href="#"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>

          <li>
            <a
              class="header_nav_item"
              href="#"
            >
              gadgets
            </a>
          </li>

          <li>
            <a
              class="header_nav_item"
              href="#"
            >
              tablets
            </a>
          </li>

          <li>
            <a
              class="header_nav_item"
              href="#"
            >
              photo
            </a>
          </li>

          <li>
            <a
              class="header_nav_item"
              href="#"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
