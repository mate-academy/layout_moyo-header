<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />

    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a
          href="#"
          class="logo-link"
        >
          <img
            class="logo"
            src="images/logo.png"
            alt="moyo-logo"
          />
        </a>

        <nav class="nav">
          <ul class="nav-links">
            <li class="link">
              <a
                href="https://apple.com"
                class="is-active"
              >
                APPLE
              </a>
            </li>
            <li class="link">
              <a href="https://samsung.com">SAMSUNG</a>
            </li>
            <li class="link">
              <a href="https://smartphones.com">SMARTPHONES</a>
            </li>
            <li class="link">
              <a
                data-qa="hover"
                href="https://laptops%26computers.com"
              >
                LAPTOPS & COMPUTERS
              </a>
            </li>
            <li class="link">
              <a href="https://gadgets.com">GADGETS</a>
            </li>
            <li class="link">
              <a href="https://tablets.com">TABLETS</a>
            </li>
            <li class="link">
              <a href="https://photo.com">PHOTO</a>
            </li>
            <li class="link">
              <a href="https://video.com">VIDEO</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
