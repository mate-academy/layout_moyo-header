<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="#logo"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="Moyo website logo"
          class="img"
        />
      </a>
      <nav>
        <ul class="list">
          <li class="nav_l apple">
            <a
              class="is-active link"
              href="#apple"
            >
              Apple
            </a>
          </li>
          <li class="nav_l samsung">
            <a
              class="link"
              href="#Samsung"
            >
              Samsung
            </a>
          </li>
          <li class="nav_l smartphones">
            <a
              class="link"
              href="#Smartphones"
            >
              Smartphones
            </a>
          </li>
          <li class="nav_l laptops-computers">
            <a
              class="link"
              href="#Laptops&Computers"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav_l gadgets">
            <a
              class="link"
              href="#Gadgets"
            >
              Gadgets
            </a>
          </li>
          <li class="nav_l tablets">
            <a
              class="link"
              href="#Tablets"
            >
              Tablets
            </a>
          </li>
          <li class="nav_l photo">
            <a
              class="link"
              href="#Photo"
            >
              Photo
            </a>
          </li>
          <li class="nav_l video">
            <a
              class="link"
              href="#Video"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
