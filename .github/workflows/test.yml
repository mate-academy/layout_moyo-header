name: Test

on:
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - name: Start server
      run: |
        npm start > /tmp/server.log 2>&1 &
        echo "Server PID: $!"
    - name: Wait for server
      run: sleep 15
    - name: Run BackstopJS
      run: npx backstop test --config backstopConfig.js
    - name: Upload HTML report(backstop data)
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: report
        path: backstop_data
